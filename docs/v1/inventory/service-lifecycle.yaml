# Service lifecycle — capability inventory
# Survey: 2026-08-24 · sources: domain/{offerings,services,catalog,ceremony,adoption-jobs,health,capacity,orchestration}, embedded manifests

- id: offering-catalog-embedded
  name: Embedded offering catalog (~50 sw manifests / 18 categories + hw manifests)
  maturity: live-proven
  verdict: keep
  what: rust-embed compiled catalog with filesystem-overlay precedence; taxonomy dictionary for intent tokens; well-known-ports; compatibility sources doc.
  surprise: hw/ manifests ship embedded next to sw (Dell Wyse 5070 full kit) indexed via find_hw_manifest(make,model).
  note: docs/poc/reference/offerings.md says "30 services" - stale by ~2x.

- id: managed-install-flow
  name: Managed offering install (offer -> container)
  maturity: live-proven
  verdict: port
  what: Manifest template + config patches merge into effective container spec (NO docker-compose files anywhere); bollard create/start; health wait (3s poll); static IP refcounted across offerings.
  surprises: Compatibility fallback can RENAME instance FQN to ::legacy at install time on failed rules; post-install LOG REGEX first-match drives image fallback config; port remaps replay from stored port_map but silently abandoned if manifest port-name count mismatches.

- id: remove-volume-contract-bug
  name: Soft-remove vs volume preservation
  maturity: live-proven
  verdict: fix-in-poc
  CONTRADICTION: service_lifecycle::remove documents "(soft delete)... volumes preserved" but delegates to remove_service with v:true - ASSOCIATED VOLUMES DELETED. Only recreate uses v:false. Doc-vs-code contradiction on a destructive path.

- id: ceremony-domain
  name: Ceremony machinery (journal, crash recovery, rollback)
  maturity: scaffolded
  verdict: redesign
  what: Multi-phase long-running ops model with persistent journal. NourishOffering fully executed. Vacate/Replant/Store/NourishStone are TYPE-FICTION - modeled in CeremonyType with no executors. No boot-time recovery consumer found for active/*.json journals.
  v2_note: Replant is a headline promise; greenfield must either implement or descope honestly.

