# Vaultwarden Compatibility — AGPL-3.0 vault (Rust). Multi-arch (amd64/arm64/armv7/armv6).
# Very light (~50MB); no special CPU features.
compatibility_rules:
  - name: "low-memory-warning"
    when:
      - host.ram.total.mb < 128
    reason: "Vaultwarden is very light (~50MB) but needs a little headroom"
    suggestion: "Runs comfortably on the smallest stones"
    warn_only: true
