kind: software
name: vaultwarden
category: secrets
description: Bitwarden-compatible password and secrets vault — lightweight Rust server (AGPL-3.0)
tags: [passwords, secrets, bitwarden, vault]
# connection template from PoC frontmatter (not consumed yet): http://{host}:{port}

inputs:
  VAULTWARDEN_SIGNUPS_ALLOWED:
    ask: Allow new user sign-ups? (lock down after the first account is created)
    default: "true"

managed:
  world: oci
  image: vaultwarden/server:1.36.0
  ports: { default: 80 }
  env:
    SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED}"
  volumes:
    - { name: vaultwarden-data, mount: /data }
  healthcheck:
    exec: [CMD, curl, --fail, --silent, "http://localhost:80/alive"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 20s
  restart: unless-stopped

compatibility:
  # PoC warn_only rule -> decide: place (warn semantics preserved in the name)
  - name: low-memory-warning
    when:
      - { path: ram.total.mb, op: lt, value: 128 }
    decide: place
    because: "Vaultwarden is very light (~50MB) but needs a little headroom"
    suggest: "Runs comfortably on the smallest stones"

# living will: flat-file state, no application lock - the imprint
# copies freely within its window.
capture:
  mode: lock-and-copy
  max_locked_s: 120
