[package]
name = "garden-moss"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "moss"
path = "src/main.rs"

[dependencies]
garden-glossary.workspace = true
garden-contract.workspace = true
async-trait = "0.1"
garden-room.workspace = true
axum.workspace = true
bollard = "0.18"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
chrono.workspace = true
clap.workspace = true
futures = "0.3"
if-addrs.workspace = true
parking_lot = "0.12"
regex = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
rust-embed = "8"
sha2 = "0.10"
sysinfo = "0.33"
tar = "0.4"
tokio.workspace = true
zstd = "0.13"
tokio-util = "0.7"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
