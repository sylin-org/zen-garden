# Harbor - Enterprise Container Registry (CNCF Graduated)
#
# IMPORTANT: Harbor is a multi-container application requiring:
# - PostgreSQL database (harbor-database)
# - Redis cache (harbor-redis)
# - Harbor Core (API server)
# - Harbor Portal (Web UI)
# - Harbor Registry (image storage)
# - Harbor Job Service (async tasks)
# - Trivy (vulnerability scanning, optional)
#
# This snippet provides basic recognition for infrastructure handlers.
# For production deployment, use Harbor's official installer:
# https://goharbor.io/docs/2.11.0/install-config/
#
# Quick start:
#   wget https://github.com/goharbor/harbor/releases/download/v2.11.2/harbor-offline-installer-v2.11.2.tgz
#   tar xzf harbor-offline-installer-v2.11.2.tgz && cd harbor
#   cp harbor.yml.tmpl harbor.yml && ./install.sh

container_name: harbor-core
image: goharbor/harbor-core:v2.11.2
ports:
  - [80, 8080]
  - [443, 8443]
environment:
  EXT_ENDPOINT: "http://localhost"
  LOG_LEVEL: "info"
  CONFIG_PATH: "/etc/core/app.conf"
  CORE_SECRET: "changeme"
  JOBSERVICE_SECRET: "changeme"
volumes:
  - harbor-data:/data
healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2.0/ping"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s
restart: unless-stopped
networks:
  - zen-garden
