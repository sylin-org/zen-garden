# PoC moss surfaces — deep inventory (2026-08-28 read-everything pass)
# Survey method: full read of src/poc/moss/src/api (all 40 files); the route
# table src/poc/moss/src/bootstrap/router.rs walked entry by entry; every
# handler read (large files read handler-by-handler). Embedded HTML pages and
# infra/listeners/pulse.rs skimmed for the pages/stream story. v1 comparison
# from src/v1/crates/moss/src/http.rs (Face enum, read in full).

# ---------------------------------------------------------------------------
# ROUTE ACCOUNTING
# ---------------------------------------------------------------------------
# - 281 `.route()` registrations in bootstrap/router.rs (the "~281 claim" is
#   exactly the count of `.route(` calls: 281, split across TWO routers —
#   `configure_public()` lobby (~86 method bindings) and `configure()` full set).
# - 301 method bindings total (182 GET / 75 POST / 20 DELETE / 11 PUT /
#   6 PATCH / 5 HEAD / 2 any-catchall). Lobby routes are re-registered inside
#   configure(), so UNIQUE method+path pairs on the full router ≈ 215
#   (~86 of them also on the plain-HTTP lobby when pond is active).
# - Advertised by /api/v1/manifest: 29 endpoint-spec entries = 27 unique paths
#   (presence/stream is pushed twice). Of those 27, 7 name paths that do NOT
#   exist in the router (stale pre-/stone-nesting spellings) → only ~20
#   advertised paths actually route. Delta vs ~215 routed pairs: ~195 routed
#   method-pairs are UNADVERTISED.
# - axum 0.8.9 / matchit 0.8.4: duplicate-path `.route()` calls MERGE their
#   method routers (verified in vendored axum source
#   routing/path_router.rs:88-101) — the ~30 same-path double registrations
#   are legal, not a boot bug.

# ---------------------------------------------------------------------------
