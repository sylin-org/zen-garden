kind: software
name: nats
category: messaging
description: NATS lightweight messaging (Apache 2.0)
tags: [messaging, pubsub, queue, lightweight, jetstream, edge]
# connection template from PoC frontmatter (not consumed yet): nats://{host}:{port}

managed:
  world: oci
  image: nats:2.10-alpine
  ports: { default: 4222, monitoring: 8222 }
  volumes:
    - { name: nats-data, mount: /data }
  advanced:
    command: [-js, -m, "8222"]
  healthcheck:
    exec: [CMD, wget, --no-verbose, --tries=1, --spider, "http://localhost:8222/healthz"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s
  restart: unless-stopped

compatibility:
  - name: insufficient-memory
    when:
      - { path: ram.total.mb, op: lt, value: 64 }
    decide: deny
    because: "NATS is lightweight but requires at least 64MB RAM"
    suggest: "Increase stone memory"
