# Harbor Registry Compatibility Rules
# Apache 2.0 licensed enterprise container registry
# ARM64 support only - NO ARM32 support
# High resource requirements (multi-container deployment)
version: "1"

compatibility_rules:
  - name: "arm32-unsupported"
    condition:
      arch_equals: "arm"
    reason: "Harbor does not support ARM32 architecture"
    suggestion: "Use Zot or Docker Registry for ARM32 devices"

  - name: "insufficient-memory"
    condition:
      memory_mb_less_than: 512
    reason: "Harbor requires at least 512MB RAM (1GB+ recommended)"
    suggestion: "Increase stone memory allocation or use lightweight registry"

  - name: "low-memory-warning"
    condition:
      memory_mb_less_than: 1024
    reason: "Harbor performs better with 1GB+ RAM"
    suggestion: "Consider increasing RAM for production workloads"
    warn_only: true

  - name: "multi-container-warning"
    condition:
      always: true
    reason: "Harbor requires multi-container deployment (database, redis, etc.)"
    suggestion: "Consider using Harbor's official installer for full functionality"
    warn_only: true

post_install_healthcheck:
  enabled: true
  scan_log_lines: 100
  timeout_seconds: 60
  patterns:
    - pattern: "Cannot allocate memory|OOM"
      reason: "Insufficient memory for Harbor"
      suggestion: "Increase RAM allocation to 1GB+"

    - pattern: "address already in use"
      reason: "Port conflict detected"
      suggestion: "Stop conflicting service or change Harbor ports"

    - pattern: "database.*error|connection.*refused"
      reason: "Database connection error"
      suggestion: "Harbor requires PostgreSQL database - ensure it's running"

    - pattern: "redis.*error|cache.*failed"
      reason: "Redis connection error"
      suggestion: "Harbor requires Redis - ensure it's running"
