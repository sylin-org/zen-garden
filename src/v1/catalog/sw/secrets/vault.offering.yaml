kind: software
name: vault
category: secrets
description: HashiCorp Vault secrets management (BSL licensed)
tags: [secrets, security, pki, encryption, identity]
# PoC frontmatter note: dev mode is in-memory only; production requires persistent storage

managed:
  world: oci
  image: hashicorp/vault:1.18
  ports: { default: 8200 }
  env:
    VAULT_DEV_ROOT_TOKEN_ID: root
    VAULT_ADDR: http://127.0.0.1:8200
  advanced:
    command: server -dev -dev-listen-address=0.0.0.0:8200
    cap_add: [IPC_LOCK]
  healthcheck:
    exec: [CMD, sh, -c, "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s
  restart: unless-stopped

compatibility:
  - name: insufficient-memory
    when:
      - { path: ram.total.mb, op: lt, value: 256 }
    decide: deny
    because: "Vault requires at least 256MB RAM for stable operation"
    suggest: "Increase stone memory or run fewer services"
