[package]
name = "garden-rake"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
garden-common = { path = "../common" }
koi-common = { workspace = true }
# Reduced from "full" - CLI only needs: multi-thread runtime, process spawning, file I/O
tokio = { version = "1.35", features = ["rt-multi-thread", "io-util", "sync", "time", "process", "macros", "fs"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
mdns-sd = "0.17"
flume = "0.11"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.5"
chrono = "0.4"
dirs = "5.0"
futures-util = "0.3"
once_cell = "1.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v7"] }
urlencoding = "2.1"
colored = "2.1"
terminal_size = "0.4"
supports-color = "3.0"
local-ip-address = "0.6.9"
hostname = "0.4"
mime_guess = "2.0"
open = "5.3"

[build-dependencies]
garden-build-utils = { path = "../build-utils" }

[[bin]]
name = "garden-rake"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
