# Build optimization configuration
# Improves compile and link times significantly

[build]
incremental = true

# Linux: Use mold linker (much faster than default ld)
# NOTE: Do NOT enable here — this config is mounted into all Docker containers
# (including x86 cross-compilation where it breaks host build scripts).
# The x64 Docker build passes mold config via env vars in compile-linux-x64.ps1.
# For native Linux builds, uncomment and install: apt install clang mold
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Windows: Reduce debug info overhead in dev builds
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/DEBUG:NONE"]

# macOS: no special flags - Apple's linker rejects -fuse-ld=lld (clang:
# "invalid linker name"), which broke the macos CI/release builds.
