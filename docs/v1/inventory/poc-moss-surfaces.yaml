    stones and push missing items, signing each push for pond enforcement.
  how: >
    Resolves managed OR adopted offerings; discovered capabilities are
    persisted back onto the offering's sub_capabilities (detail-only, no
    chirp sync). Mirror orchestrates via cross_stone::resolve_stone_endpoint
    and dedups by (cap_type, name).
  evidence:
