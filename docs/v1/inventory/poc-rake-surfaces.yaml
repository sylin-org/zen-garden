- id: rake-find
  name: find
  kind: command
  category: Discovery
  flags: ["<query> (name | c:category | t:tag | FQN | FQN[type:item,...])", "--format human|json|uri|uri-ip", "--ensure (flag)", "--at"]
  endpoint: "GET /api/v1/garden/services?q=<query>[&fresh=true]; ensure path: GET /api/v1/stone/offerings/{name}, POST /api/v1/stone/services, GET /api/v1/stone/offerings/{name}/capabilities, POST /api/v1/stone/offerings/{name}/capabilities, GET /api/v1/garden/tools/stream?fqid=...&capability=... (SSE readiness wait)"
  what: >
    Garden-wide service lookup returning connection URIs; cache-first (topology), with
    sanitization of queries. Ensure mode auto-provisions: installs the offering, waits on
    the tools SSE stream for readiness (240s), re-queries; also understands capability
    wishes like `ollama[model:llama3.2]`. Exit codes: 1 not-found, 3 provisioning failed.
  how: >
    Query → server-side search. Not-found + --ensure + name-search → offering install
    (job-id parsed from prose "Job ID:" fallback) → retry. Capability-wish path parses
    selectors, ensures base offering, adds capabilities, waits for tool upsert matching
    fqid + selectors.
  rendering: >
    human (name (category) on stone + first URI + multi-result summary + JSON hint),
    json (pretty ServiceDiscoveryResponse), uri/uri-ip (bare URI lines, IP = uris[1]),
    --field dot/bracket extraction (e.g. services[0].connection.uris[0]).
  evidence:
    - "commands/discovery/find.rs:121-175 — execute + format dispatch"
    - "commands/discovery/find.rs:199-247 — GET /api/v1/garden/services?q="
    - "commands/discovery/find.rs:284-359 — install_offering + job-id prose parsing"
    - "commands/discovery/find.rs:591-687 — wait_for_tool_ready SSE"
    - "commands/discovery/find.rs:839 — suggestion prints 'find <q> ensure' syntax"
    - "command_manifest.rs:732-734 — example 'garden-rake find mongodb ensure'"
  gaps:
    - "BUG: manifest example and find's own not-found hint say `find mongodb ensure` (trailing word) but --ensure is a FLAG; trailing 'ensure' is an unexpected positional and fails clap parsing (find.rs:839, command_manifest.rs:732-734 vs route.rs:89)"
    - "install_offering parses job_id out of the human-readable 'message' string when structured job_id absent (find.rs:316-330) — brittle"
  maturity: live-proven
  v1: yes
  v1_note: v1 find matches pattern → stones; PoC find returns connection URIs with ensure-provisioning — significantly richer.

