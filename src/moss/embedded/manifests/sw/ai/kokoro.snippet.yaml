container_name: kokoro
image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.2.4
ports:
  default: [8880, 8880]
environment:
  USE_GPU: "true"
  DEFAULT_VOICE: "af_heart"
  API_LOG_LEVEL: "info"
  ENABLE_WEB_PLAYER: "true"
  SAMPLE_RATE: "24000"
# GPU passthrough for NVIDIA stones (ignored on CPU fallback image)
deploy:
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]
healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s
restart: unless-stopped
networks:
  - zen-garden
