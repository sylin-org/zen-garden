# OpenedAI Speech hardware compatibility (three-tier: NVIDIA → ROCm → CPU)
#
# Default image: ghcr.io/matatonic/openedai-speech:latest (NVIDIA CUDA, XTTS v2)
# Fallback 1: ghcr.io/matatonic/openedai-speech-rocm:latest (AMD ROCm, XTTS v2)
# Fallback 2: ghcr.io/matatonic/openedai-speech-min:latest (CPU-only, Piper only)

compatibility_rules:
  # No NVIDIA GPU — check if AMD GPU available for ROCm fallback
  - name: "no-nvidia-use-rocm"
    when:
      - host.ai.runtime LACKS cuda
      - host.ai.runtime HAS rocm
    reason: "No NVIDIA GPU detected. Using AMD ROCm image for XTTS v2 voice synthesis."
    fallback:
      image: "ghcr.io/matatonic/openedai-speech-rocm:latest"
      name: "rocm"

  # No GPU at all — CPU-only with Piper backend
  - name: "no-gpu-use-cpu"
    when:
      - host.ai.runtime LACKS cuda
      - host.ai.runtime LACKS rocm
    reason: "No GPU runtime available. Using CPU-only minimal image (Piper voices only, no XTTS v2)."
    fallback:
      image: "ghcr.io/matatonic/openedai-speech-min:latest"
      name: "cpu"

  - name: "low-vram-warning"
    when:
      - host.gpu.vram.total.mb < 4096
    reason: "XTTS v2 requires ~4GB VRAM for voice synthesis"
    suggestion: "Use the Piper backend (CPU-only, minimal image) or a GPU with 4GB+ VRAM"
    warn_only: true
    continue: true

  - name: "insufficient-memory"
    when:
      - host.ram.total.mb < 4096
    reason: "XTTS v2 requires at least 4GB RAM (8GB recommended)"
    suggestion: "Use the minimal image with Piper backend (~1GB RAM) or increase memory"

  - name: "arm32-not-supported"
    when:
      - host.architecture IN (armv7l,armv6l)
    reason: "OpenedAI Speech Docker images require amd64"
    suggestion: "Use amd64 hardware"

post_install_healthcheck:
  enabled: true
  scan_log_lines: 100
  timeout_seconds: 60
  patterns:
    - pattern: "CUDA.*error|cuda.*fail"
      reason: "GPU initialization failed"
      suggestion: "Use the minimal image (-min) for CPU-only Piper TTS"
      fallback:
        image: "ghcr.io/matatonic/openedai-speech-min:latest"
        name: "cpu"

    - pattern: "HIP.*error|hip.*fail|ROCm.*error"
      reason: "AMD ROCm GPU initialization failed"
      suggestion: "Check ROCm drivers. Fall back to CPU-only Piper."
      fallback:
        image: "ghcr.io/matatonic/openedai-speech-min:latest"
        name: "cpu"

    - pattern: "Cannot allocate memory|OOM"
      reason: "Insufficient memory for XTTS v2 model"
      suggestion: "Use the minimal image with Piper backend"
