---
# Ollama CPU-Only Adopted Mode Manifest
# Detects and manages native Ollama installations on CPU-only thin clients.
#
# This manifest is functionally identical to ollama.adopted.yaml but serves
# as the detection/management config when a thin client operator chooses the
# ollama-cpu offering. The same Ollama binary handles both GPU and CPU modes.
#
# Installation:
#   Linux:   curl -fsSL https://ollama.com/install.sh | sh
#   Windows: https://ollama.com/download/windows

name: ollama-cpu
description: Ollama CPU-only inference for thin clients (native installation)
category: ai
modes:
  - adopted
tags:
  - ai
  - llm
  - inference
  - embedding
  - cpu
  - thin-client
  - local-ai

# Detection rules — identical to ollama (same binary, same ports)
detection:
  windows:
    - method: command
      config:
        command: ollama --version
        expected_pattern: "version is ([0-9]+\\.[0-9]+\\.[0-9]+)"
        expected_exit_code: 0
      stability_threshold: 1
      cache_ttl_secs: 3600

    - method: command
      config:
        command: ollama --version
        expected_pattern: "^ollama version is"
        expected_exit_code: 0
      stability_threshold: 1
      cache_ttl_secs: 60

    - method: http_probe
      config:
        url: http://localhost:11434/api/tags
        expected_status: 200
        timeout_ms: 2000
      stability_threshold: 1
      cache_ttl_secs: 60

  linux:
    - method: command
      config:
        command: ollama --version
        expected_pattern: "version is ([0-9]+\\.[0-9]+\\.[0-9]+)"
        expected_exit_code: 0
      stability_threshold: 1
      cache_ttl_secs: 3600

    - method: command
      config:
        command: ollama --version
        expected_pattern: "^ollama version is"
        expected_exit_code: 0
      stability_threshold: 1
      cache_ttl_secs: 60

    - method: http_probe
      config:
        url: http://localhost:11434/api/tags
        expected_status: 200
        timeout_ms: 2000
      stability_threshold: 1
      cache_ttl_secs: 60

# Control configuration
control:
  level: monitor
  health_check_url: http://localhost:11434/api/tags

# Connectivity enforcement (LAN access) — same as regular ollama
connectivity:
  enforce: true
  enforce_cooldown_secs: 30
  max_attempts: 5

  windows:
    checks:
      - method: command
        config:
          command: 'powershell -Command "$ip=''{{lan_ip}}''; $ok=(Get-NetTCPConnection -LocalPort {{port}} -State Listen | Where-Object { $_.LocalAddress -eq ''0.0.0.0'' -or $_.LocalAddress -eq $ip } | Select-Object -First 1); if($ok){''True''} else {''False''}"'
          expected_pattern: "True"
          expected_exit_code: 0
      - method: http_probe
        config:
          url: "http://{{lan_ip}}:{{port}}/api/tags"
          expected_status: 200
          timeout_ms: 2000
    ensure:
      - command: 'powershell -Command "$svc=Get-Service -Name ''Ollama'' -ErrorAction SilentlyContinue; if($svc){Stop-Service -Name ''Ollama'' -ErrorAction SilentlyContinue}; Get-Process -Name ''ollama'' -ErrorAction SilentlyContinue | Stop-Process -Force"'
        continue_on_error: true
      - command: 'powershell -Command "$exe=$null; $candidates=@(\"$env:LOCALAPPDATA\\Programs\\Ollama\\ollama.exe\",\"$env:ProgramFiles\\Ollama\\ollama.exe\"); foreach($p in $candidates){ if(Test-Path $p){$exe=$p; break} }; if(-not $exe){$exe=''ollama''}; Start-Process -FilePath $exe -ArgumentList \"serve --host 0.0.0.0:{{port}}\" -WindowStyle Hidden"'
        continue_on_error: true
      - command: 'powershell -Command "$env:OLLAMA_HOST=''0.0.0.0:{{port}}''; setx OLLAMA_HOST ''0.0.0.0:{{port}}'' | Out-Null; setx /M OLLAMA_HOST ''0.0.0.0:{{port}}'' | Out-Null"'
        continue_on_error: true
      - command: 'powershell -Command "New-NetFirewallRule -DisplayName ''Ollama CPU {{port}}'' -Direction Inbound -Protocol TCP -LocalPort {{port}} -Action Allow -ErrorAction SilentlyContinue"'
        continue_on_error: true

  linux:
    checks:
      - method: command
        config:
          command: "ss -ltn | grep -E '(0.0.0.0|\\[::\\]):{{port}}'"
          expected_exit_code: 0
      - method: http_probe
        config:
          url: "http://{{lan_ip}}:{{port}}/api/tags"
          expected_status: 200
          timeout_ms: 2000
    ensure:
      - command: "sudo mkdir -p /etc/systemd/system/ollama.service.d"
        continue_on_error: true
      - command: "sudo sh -c \"printf '[Service]\\nEnvironment=OLLAMA_HOST=0.0.0.0:{{port}}\\nEnvironment=CUDA_VISIBLE_DEVICES=\\nEnvironment=OLLAMA_MAX_LOADED_MODELS=1\\nEnvironment=OLLAMA_NUM_PARALLEL=1\\n' > /etc/systemd/system/ollama.service.d/override.conf\""
        continue_on_error: true
      - command: "sudo systemctl daemon-reload"
        continue_on_error: true
      - command: "sudo systemctl restart ollama"
        continue_on_error: true
      - command: "sudo ufw allow {{port}}/tcp"
        continue_on_error: true
      - command: "sudo firewall-cmd --permanent --add-port={{port}}/tcp"
        continue_on_error: true
      - command: "sudo firewall-cmd --reload"
        continue_on_error: true

# Connection profile
connection:
  protocol: http
  uri_template: "{protocol}://{host}:{port}"
  endpoints:
    base: "/"
    api: "/api"
    generate: "/api/generate"
    embeddings: "/api/embeddings"
    models: "/api/tags"
