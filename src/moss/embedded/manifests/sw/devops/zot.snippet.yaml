container_name: zot
image: ghcr.io/project-zot/zot-linux-amd64:v2.1.1
ports:
  - [5000, 5000]
environment:
  ZOT_LOG_LEVEL: "info"
  ZOT_HTTP_ADDRESS: "0.0.0.0"
  ZOT_HTTP_PORT: "5000"
  ZOT_STORAGE_ROOT_DIRECTORY: "/var/lib/zot"
  ZOT_STORAGE_DEDUPE: "true"
  ZOT_STORAGE_GC: "true"
volumes:
  - zot-data:/var/lib/zot
healthcheck:
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/v2/"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s
restart: unless-stopped
networks:
  - zen-garden
