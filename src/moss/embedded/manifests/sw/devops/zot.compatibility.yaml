# Zot Registry Compatibility Rules
# Apache 2.0 licensed OCI-native registry
# Multi-arch support: amd64, arm64v8, arm32v7
# No AVX/SSE requirements (Go binary)

compatibility_rules:
  - name: "insufficient-memory"
    when:
      - host.ram.total.mb < 64
    reason: "Zot requires at least 64MB RAM"
    suggestion: "Increase stone memory allocation"

  - name: "low-memory-warning"
    when:
      - host.ram.total.mb < 128
    reason: "Zot benefits from 128MB+ RAM for concurrent operations"
    suggestion: "Consider increasing RAM for production workloads"
    warn_only: true

image_selection:
  - architecture: amd64
    image: ghcr.io/project-zot/zot-linux-amd64:v2.1.1

  - architecture: arm64
    image: ghcr.io/project-zot/zot-linux-arm64:v2.1.1

  - architecture: arm32
    image: ghcr.io/project-zot/zot-linux-arm:v2.1.1

post_install_healthcheck:
  enabled: true
  scan_log_lines: 100
  timeout_seconds: 30
  patterns:
    - pattern: "Cannot allocate memory|OOM"
      reason: "Insufficient memory for Zot"
      suggestion: "Increase RAM allocation"

    - pattern: "address already in use"
      reason: "Port 5000 already in use"
      suggestion: "Stop conflicting service or change Zot port"

    - pattern: "storage.*error|filesystem.*failed"
      reason: "Storage backend error"
      suggestion: "Check data volume permissions and disk space"

    - pattern: "invalid configuration|config.*error"
      reason: "Configuration error"
      suggestion: "Check Zot configuration"
