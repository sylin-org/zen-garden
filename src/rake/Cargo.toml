[package]
name = "garden-rake"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
garden-common = { path = "../common" }
garden-discovery = { path = "../discovery" }
koi-common.workspace = true
os-truststore.workspace = true

# Core
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
urlencoding.workspace = true

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "sync", "time", "process", "macros", "fs"] }
futures-util.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yml.workspace = true

# HTTP
reqwest = { workspace = true, features = ["json", "webpki-roots", "stream"] }

# CLI
clap = { workspace = true, features = ["derive"] }

# Observability
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# mDNS deps moved to garden-discovery (DISC-0001); hostname + if-addrs
# stay because Rake uses them directly outside the discovery module.
hostname.workspace = true
if-addrs.workspace = true

# UI
colored.workspace = true
terminal_size = "0.4"
supports-color = "3.0"

# Utilities
base64.workspace = true
mime_guess.workspace = true
open.workspace = true
bytes = "1.5"
dirs = "5.0"
flume = "0.11"

[build-dependencies]
garden-build-utils = { path = "../build-utils" }

[lints]
workspace = true

[[bin]]
name = "garden-rake"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
