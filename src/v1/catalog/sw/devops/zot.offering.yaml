kind: software
name: zot
category: devops
description: Lightweight OCI-native container registry with built-in pull-through cache and deduplication (Apache 2.0, Linux Foundation)
tags: [docker, container, registry, oci, images, container-registry, pull-through, cache, dedup]

managed:
  world: oci
  # Zot publishes per-architecture images (no multi-arch manifest); base is amd64,
  # ARM stones are switched by the fallback rules below (from PoC image_selection)
  image: ghcr.io/project-zot/zot-linux-amd64:v2.1.1
  ports: { default: 5000 }
  volumes:
    - { name: zot-data, mount: /var/lib/zot }
  env:
    ZOT_LOG_LEVEL: "info"
    ZOT_HTTP_ADDRESS: "0.0.0.0"
    ZOT_HTTP_PORT: "5000"
    ZOT_STORAGE_ROOT_DIRECTORY: "/var/lib/zot"
    ZOT_STORAGE_DEDUPE: "true"
    ZOT_STORAGE_GC: "true"
  healthcheck:
    exec: [CMD, wget, --no-verbose, --tries=1, --spider, "http://localhost:5000/v2/"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s
  restart: unless-stopped

compatibility:
  # PoC image_selection rules -> decide: fallback into the matching image
  - name: arm64-platform-image
    when:
      - { path: machine.architecture, op: in, value: [aarch64, arm64] }
    decide: fallback
    into: { image: ghcr.io/project-zot/zot-linux-arm64:v2.1.1 }
    because: "Zot publishes architecture-specific images; using the arm64 build"
  - name: arm32v7-platform-image
    when:
      - { path: machine.architecture, op: eq, value: armv7l }
    decide: fallback
    into: { image: ghcr.io/project-zot/zot-linux-arm:v2.1.1 }
    because: "Zot publishes architecture-specific images; using the arm32v7 build"
  - name: insufficient-memory
    when: [{ path: ram.total.mb, op: lt, value: 64 }]
    decide: deny
    because: "Zot requires at least 64MB RAM"
    suggest: Increase stone memory allocation
  # PoC warn_only rule -> decide: place (warn semantics preserved in the name)
  - name: low-memory-warning
    when: [{ path: ram.total.mb, op: lt, value: 128 }]
    decide: place
    because: "Zot benefits from 128MB+ RAM for concurrent operations"
    suggest: Consider increasing RAM for production workloads
