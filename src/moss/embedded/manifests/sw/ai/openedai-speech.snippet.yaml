container_name: openedai-speech
image: ghcr.io/matatonic/openedai-speech:latest
ports:
  default: [8001, 8000]
volumes:
  - openedai-speech-voices:/app/voices
  - openedai-speech-config:/app/config
environment:
  TTS_HOME: "voices"
  HF_HOME: "voices"
deploy:
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities:
            - [gpu]
healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s
restart: unless-stopped
networks:
  - zen-garden
