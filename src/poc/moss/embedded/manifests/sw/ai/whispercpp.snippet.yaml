container_name: whispercpp
image: ghcr.io/ggml-org/whisper.cpp:main
ports:
  default: [8080, 8080]
volumes:
  - whispercpp-models:/models
command: ["whisper-server", "--host", "0.0.0.0", "--port", "8080", "-m", "/models/ggml-base.en.bin", "--convert"]
healthcheck:
  test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s
restart: unless-stopped
networks:
  - zen-garden
