[package]
name = "garden-cricket"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "garden-cricket"
path = "src/main.rs"

[dependencies]
garden-common = { path = "../common" }

# Core
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# Config & CLI
clap = { workspace = true, features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"

# HTTP client for SSE
reqwest = { workspace = true, features = ["stream"] }
axum.workspace = true
futures-util = "0.3"
tokio-stream = "0.1"

# Audio playback
rodio = "0.18"

# Embedded assets
rust-embed = "8"

# File watching (for sample library hot-reload)
notify = "6.1"

# Terminal UI for test mode
crossterm = "0.27"
