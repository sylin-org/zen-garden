[package]
name = "garden-probe"
version = "0.1.0"
edition = "2021"
description = "Integration test harness for Zen Garden"

[[bin]]
name = "garden-probe"
path = "src/main.rs"

[dependencies]
# Consume garden_common for API types and HTTP client (read-only)
garden-common = { path = "../common" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# HTTP client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v7", "serde"] }
urlencoding = "2.1.3"
