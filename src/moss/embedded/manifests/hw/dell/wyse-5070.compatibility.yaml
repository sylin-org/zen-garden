# Dell Wyse 5070 Service Compatibility
# Evaluated at `offer` time to guide service placement
#
# This is the inverse of sw compatibility - answers:
# "Given this hardware, what services fit well?"

version: "1"

# =============================================================================
# SERVICE RECOMMENDATIONS
# =============================================================================

# Services that run excellently on this hardware
recommended:
  - redis           # In-memory, no disk wear
  - memcached       # In-memory cache
  - traefik         # Low resource reverse proxy
  - pihole          # DNS filtering, minimal resources
  - adguard-home    # Alternative DNS filtering
  - mqtt            # Lightweight messaging
  - homepage        # Dashboard, static content
  - authelia        # Auth proxy, low resources

# Services that work but have caveats
caution:
  - mongodb         # Write-heavy, eMMC concern
  - postgresql      # Write-heavy, eMMC concern
  - mariadb         # Write-heavy, eMMC concern
  - prometheus      # Moderate writes
  - grafana         # Works but check storage
  - nextcloud       # Storage and write concerns
  - vault           # Works if storage is adequate

# Services not recommended for this hardware
not_recommended:
  - ollama          # No AVX = extremely slow
  - elasticsearch   # RAM hungry, write heavy
  - opensearch      # RAM hungry, write heavy
  - milvus          # Requires AVX, RAM hungry
  - weaviate        # Vector DB, needs more resources
  - couchbase       # RAM hungry
  - sqlserver       # Needs more RAM, write heavy

# =============================================================================
# WARNING RULES
# =============================================================================
# Evaluated when offering services to stones running on this hardware

warnings:
  # eMMC write endurance warning
  - name: "emmc-write-intensive"
    services:
      - mongodb
      - postgresql
      - mariadb
      - elasticsearch
      - opensearch
      - nextcloud
      - prometheus
    reason: "Onboard eMMC storage has limited write endurance (~3000 P/E cycles)"
    suggestion: "Add M.2 SATA SSD (Extended model) or external USB storage for database workloads"
    warn_only: true

  # No AVX warning for AI/ML workloads
  - name: "no-avx-ai-warning"
    services:
      - ollama
    reason: "Celeron J4105 and Pentium J5005 lack AVX instructions"
    suggestion: |
      Ollama will run but inference is extremely slow (~0.5-2 tokens/sec).
      Consider: remote inference, different hardware, or tiny models only (tinyllama).
    warn_only: false  # Strong recommendation against

  # No AVX warning for vector databases
  - name: "no-avx-vector-warning"
    services:
      - milvus
      - weaviate
    reason: "Vector databases benefit significantly from AVX/AVX2 instructions"
    suggestion: "Performance will be severely degraded. Use a different stone for vector workloads."
    warn_only: true

  # RAM limitation warning
  - name: "ram-hungry-services"
    services:
      - elasticsearch
      - opensearch
      - couchbase
      - milvus
    reason: "These services typically require 8GB+ RAM to function well"
    suggestion: "Ensure stone has 8GB RAM and no other memory-intensive services"
    warn_only: true

# =============================================================================
# CAPABILITY SCORING ADJUSTMENTS
# =============================================================================
# Modify placement scores for this hardware

scoring:
  # Boost for lightweight services
  boost:
    tags: ["lightweight", "cache", "proxy", "dns"]
    adjustment: +2

  # Penalty for write-heavy services (unless SSD detected)
  penalty:
    tags: ["database", "write-heavy"]
    adjustment: -3
    condition: "storage_type == 'emmc'"

  # Strong penalty for AVX-dependent services
  penalty_strong:
    tags: ["ai", "vector", "ml"]
    adjustment: -10
