- id: multi-platform-build-coordinator
  name: Build coordination (4 platforms: linux-x64/x86/arm64-glibc/windows-x64 + android musl)
  maturity: live-proven
  verdict: keep
  what: build.ps1 resolves deps once then platform builds --frozen; staging destroyed per run; packages ALWAYS include previously-built binaries so core-tier iteration keeps old companions.
  drift: Tier defaults differ by entry point (core vs full vs core).

- id: docker-perennial-builder
  name: Perennial Docker cross-build containers
  maturity: live-proven
  verdict: port
  what: Builder image reused until Cargo.lock hash changes (SHA-16 marker); workspace + ../koi mounted RO; target+cargo cache in named volumes; mold via env not config (x86 cross safety).
  constraint: koi path dep requires sibling checkout mounted at /koi.

- id: cross-target-matrix
  name: Cross-target strategies (x86 bookworm pin / arm64 glibc / android QEMU-native musl)
  maturity: live-proven
  verdict: keep
  what: x86+arm64 pinned to rust:bookworm (trixie glibc too new; phone kernel 4.9); Android builds NATIVE musl under qemu binfmt from arm64 alpine - sidesteps aarch64 cross pain; moss drops udev feature on musl; firefly gates libudev by cfg.
  v2_note: The musl-native-under-QEMU trick is worth preserving verbatim.

