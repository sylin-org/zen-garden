- id: offering-lifecycle
  name: Offering lifecycle (plant/take-away/heal/search/inspect/test/export + services layer)
  kind: route-cluster
  what: >
    Two-layer model: human layer /stone/offerings (list/search/get/plant/
    delete; plant+delete are thin delegates into services create/delete with
    .data unwrapping) and technical layer /stone/services (create, list,
    get, delete keeping volumes, destroy, rest/wake/restart/nourish/upgrade,
    cordon, reassign rename, logs SSE, env get/patch with manifest allowlist,
    owned config patches with volume-path validation and least-destructive
    container cycling). Plus image-direct inspect, taxonomy search, manifest
    test-deploy, and export (curated manifest or synthesized from running
    container).
  how: >
    create_service returns ServiceActionResponse with job_id for async
    installs; suggestions are generated contextually (suggestions.rs) and
    suppressed via X-Quiet header. Service search sanitizes input against
    suspicious patterns and supports c:/cat:/t: prefixes.
  evidence:
    - "src/poc/moss/src/api/v1/offerings.rs:262-311 — plant/take-away delegation + .data unwrap"
    - "src/poc/moss/src/api/v1/services.rs:239-307 — install outcomes incl. image-direct + adopted"
    - "src/poc/moss/src/api/v1/config.rs:143-190 — OFFER-0008 volume host-path validation"
    - "src/poc/moss/src/api/suggestions.rs:39-111 — X-Quiet-gated CLI suggestions"
  gaps:
    - "Envelope drift inside one cluster: services rest/wake/delete wrapped, restart/reconcile/refresh/reassign bare; env uses a third quasi-envelope {data,manageable}"
    - "get_manifest/{name}/manifest return raw YAML strings with ApiErrorResponse errors (mixed media types)"
    - "plant_offering forwards an EMPTY HeaderMap to create_service — X-Quiet and envelope-signing headers are dropped (offerings.rs:280-285)"
    - "deploy_stone_v1 runs tar via blocking std::process::Command inside the async handler (stone.rs:386)"
  maturity: live-proven
  v1: partial
  v1_note: >
    v1 covers plant/show/uproot/rest/wake at /api/v1/offerings/{fqn}. Missing:
    search, inspect image-direct, heal/reconcile, env management, config
    patches, cordon, reassign, per-service logs, nourish (upgrade).

- id: adoption-borrowing
  name: Adoption & borrowing
  kind: route-cluster
  what: >
    Adopt = detect an already-running container and register it under an
    adopted FQN with a control level (full/monitor/announce), connectivity
    enforcement, and generated guidance. Borrow = register an external
    network service (URL), optionally storing credentials in the Koi vault.
    Lists for adoptable (live container detection per catalog manifest),
    adopted, borrowed; unadopt/unborrow remove registration only.
  how: >
    adopt runs detection → connectivity enforcement (degrade on failure) →
    Offering with OfferingModeData::Adopted; borrow parses the URL into a
    location and stores credentials under borrowed:{name}:credentials in the
    vault (best-effort with warn on failure).
  evidence:
    - "src/poc/moss/src/api/v1/adoption.rs:83-252 — adopt flow"
    - "src/poc/moss/src/api/v1/adoption.rs:382-476 — borrow + vault storage"
  gaps:
