# Harbor requires docker-compose with multiple containers.
# This snippet is for infrastructure handler recognition only.
# For full deployment, use Harbor's official installer.
# See: https://goharbor.io/docs/2.11.0/install-config/
container_name: harbor-core
image: goharbor/harbor-core:v2.11.2
ports:
  - [8080, 8080]
  - [5080, 5000]
environment:
  EXT_ENDPOINT: "http://localhost:8080"
  LOG_LEVEL: "info"
  CONFIG_PATH: "/etc/core/app.conf"
volumes:
  - harbor-data:/data
healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2.0/ping"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s
restart: unless-stopped
networks:
  - zen-garden
# NOTE: This is a PARTIAL offering. Harbor requires:
# - PostgreSQL database
# - Redis cache
# - Harbor Portal
# - Harbor Registry
# - Harbor Job Service
# See harbor.research.md for full deployment instructions.
