- id: health-monitor-reconcile
  name: Health monitoring + missing-container reconciliation
  maturity: live-proven (WINDOWS, witnessed 2026-08-25)
  verdict: keep
  what: HealthProbe port (DockerHealthProbe via inspect); 30s monitor re-enters install for missing containers sharing ReconcileResult writeback; wait_until_healthy primitive reused by flows.
  live_evidence: Running dist garden-moss.exe on Windows workstation (ephemeral mode) after containers vanished -> boot reconcile pulled 6 images (searxng, qdrant v1.18.0, whisper.cpp, speaches, kokoro-fastapi-cpu ~83MB, infinity) attempt 1/5, RECONCILED with "ports preserved" (stored port_map replay), containers live again from host-mapped persistent content. Also visible live: config precedence CLI>Env>Config>Defaults, 51 manifests loaded, DxDiag GPU detection, capability cache persisted, auto-adoption probing adopted-native ollama at :11434 (failing honestly while ollama down).
  fleet_mystery_solved: "stone-leaded-sparkle" (the 'sleeping stone' from fleet sweeps) IS this Windows workstation running moss ephemerally, part-time. It misses deploys while moss is down -> explains observed version skew. Part-time/ephemeral stones are a REAL usage mode the greenfield should own explicitly (nourish-on-wake), not warn about.
  live_evidence_2: Same session, `rake tend this` + `rake list`: 9 services — the 6 reconciled containers came back DORMANT (created-not-started) because the registry remembered them rested before the wipe; reconcile restored DESIRED STATE, not blanket-running. Ports preserved, state memory honored. Meanwhile ollama::adopted flipped failing->thriving live once the native ollama process started — the adopted-service health loop closing end-to-end (probe fail reported honestly, recovery detected, status corrected).

