[workspace]
members = [
  "src/lantern",
  "src/common",
  "src/discovery",
  "src/moss",
  "src/rake",
  "src/cricket",
  "src/firefly",
  "src/companion-sdk",
  "src/companion-usb",
  "src/build-utils",
  "src/probe",
  "src/pavilion",
]
exclude = [
  # Orchestrators are standalone crates — not part of this workspace.
  # Each builds independently inside its own Docker image.
  "src/orchestrators/common",
  "src/orchestrators/ollama",
  "src/orchestrators/mongodb",
  "src/orchestrators/postgresql",
  "src/orchestrators/valkey",
  "src/orchestrators/weaviate",
  "src/orchestrators/ai",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Koan Framework"]

[workspace.dependencies]
# Core
anyhow = "1"
thiserror = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v7"] }
rand = "0.9"
regex = "1"

# Async runtime — minimal features; each crate adds what it needs
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yml was unmaintained + unsound (RUSTSEC-2025-0067/0068).
# Aliased to serde_yaml_ng (maintained drop-in with identical API)
# so the existing `serde_yml::` callsites keep compiling.
serde_yml = { package = "serde_yaml_ng", version = "0.10" }

# HTTP
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "webpki-roots", "stream", "rustls"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Crypto / hashing
blake3 = "1"
base64 = "0.22"

# Networking
socket2 = "0.6"
if-addrs = "0.15"
mdns-sd = "0.18"

# System
sysinfo = "0.38"
walkdir = "2"
hostname = "0.4"
urlencoding = "2"
mime_guess = "2"
colored = "3"
url = "2"
rust-embed = "8"
open = "5"
tempfile = "3"

# Koi framework — published on crates.io (github.com/sylin-org/koi).
# Lean consumption: `default-features = false` drops koi's optional `docker`
# (bollard) and `keyring` (OS-keychain) backends — zen never uses koi's runtime
# backend, and the vault falls back to its machine-bound passphrase store. `qr`
# is armed on koi-crypto so the pond ceremony still renders PNG QR codes.
# For local koi development, see .cargo/config.local.toml.example.
koi-embedded = { version = "0.4", default-features = false }
koi-certmesh = { version = "0.4", default-features = false }
koi-common = "0.4"
koi-crypto = { version = "0.4", default-features = false, features = ["qr"] }
koi-truststore = "0.4"

# ============================================================================
# Workspace-wide lint policy — enforces code-standards.md mechanically
# ============================================================================
[workspace.lints.clippy]
# Code standards §16: unsafe blocks must document invariants
# Set to "warn" for gradual adoption; promote to "deny" after full audit
undocumented_unsafe_blocks = "warn"
# Code standards §17: no .unwrap() on external data
# Set to "allow" at workspace level; enable per-crate as they're audited
unwrap_used = "allow"
# Incomplete work markers
todo = "allow"
unimplemented = "warn"
# Prefer native async fn over manual desugaring
manual_async_fn = "warn"
# Pin<Box<dyn Future>> is inherently verbose — allow until ARCH-0007 completes
type_complexity = "allow"

[workspace.lints.rust]
# Edition 2024 will enforce this; start warning now
unsafe_op_in_unsafe_fn = "warn"

# Dev profile: faster iteration
[profile.dev]
opt-level = 1              # Light optimization (faster than 0, still fast compile)
split-debuginfo = "packed" # Reduce linker work on incremental builds

# Optimize dependencies even in dev (they don't change often)
[profile.dev.package."*"]
opt-level = 2

# Optimize build scripts and proc-macros in dev (serde, clap derive run faster)
[profile.dev.build-override]
opt-level = 3

[profile.release]
strip = true      # Remove symbols for smaller binaries
lto = true        # Link-time optimization (full - slowest, smallest)
codegen-units = 1 # Better optimization (slower compile, smaller binary)

# Fast release profile for development iteration
# Usage: cargo build --profile fast-release
# Trade-off: ~5-10% larger binaries, ~1-3% slower runtime, ~40% faster compile
[profile.fast-release]
inherits = "release"
lto = "thin"      # Thin LTO: 80% of full LTO benefit, much faster compile
codegen-units = 4 # Parallel codegen: 4x faster than codegen-units=1
strip = true      # Still strip symbols
