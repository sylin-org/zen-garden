[package]
name = "garden-companion-usb"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "USB serial device discovery + lifecycle domain for Zen Garden companions (COMPANION-0018)"

[lib]
name = "garden_companion_usb"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7"
tracing.workspace = true
serde.workspace = true

# USB serial discovery + device lifecycle
thiserror = "2"
async-trait = "0.1"

# serialport pulls libudev on Linux for port enumeration. musl (the Android/arm64 Stone build) has
# no libudev, so drop it there — open() and /sys-based listing still work, and device identity comes
# from probing. Desktop/glibc keeps the richer libudev enumeration.
[target.'cfg(not(target_env = "musl"))'.dependencies]
serialport = "4.3"

[target.'cfg(target_env = "musl")'.dependencies]
serialport = { version = "4.3", default-features = false }

# Event-driven hotplug via libudev on glibc Linux (firefly etc.); the cross-platform PollMonitor is
# the fallback. libudev is absent on musl, so gate udev/mio out there — musl uses PollMonitor.
[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
udev = "0.9"
mio = { version = "1", features = ["os-poll", "os-ext"] }

[lints]
workspace = true
