  v1: MISSING

- id: jobs
  name: Jobs tracking + per-job SSE
  kind: route-cluster
  what: >
    In-memory job registry for long-running ops (install, capture_snapshot,
    plant_snapshot, refresh-capabilities, nourish): list, get, and a per-job
    SSE stream whose FIRST frame is job.snapshot (closing the subscribe race),
    filters the unified pulse channel by job_id, and auto-closes on terminal
    event. Terminal jobs are retained 24h for reconnect.
  how: >
    Unknown job_id is deliberately permissive: both GET and the stream return
    a synthetic status=Failed job rather than an error envelope, so SSE
    clients have one code path.
  evidence:
    - "src/poc/moss/src/api/v1/jobs.rs:54-85 — 404-with-stub quirk"
    - "src/poc/moss/src/api/v1/jobs.rs:158-261 — snapshot-first SSE with auto-close"
  gaps:
    - "Jobs are memory-only — 'lost on daemon restart' (jobs.rs:90); the 24h TTL claim only holds while the process lives"
    - "terminal_seen tracking in the stream closure uses a captured mut var with a vestigial already_terminal (jobs.rs:203,217) — read-and-ignore leftover"
  maturity: live-proven
  v1: MISSING
  v1_note: >
    v1 has no async-job concept; long ops are background runs surfaced via
    capture last-run GET only.

- id: greenhouse-authoring
  name: Greenhouse (catalog + manifest authoring + file CRUD)
  kind: route-cluster
  what: >
    The offering-upkeep module: unified omni-catalog (embedded curated +
    runtime custom overlays + installed state + compatibility + file
    inventory), file read (runtime overlay first, embedded fallback) /
    write (creates overlay for built-ins) / delete (reset-to-builtin) per
    typed file (snippet/frontmatter/compatibility/guidance/research/adopted/
    capabilities), real-time validate, generate-from-inspection, whole-
    offering export bundle, and a running-container picker.
  how: >
    Files live under {runtime_manifests_dir}/sw/{category}/{name}{suffix};
    embedded equivalents come from EmbeddedManifests. GET file returns
    text/plain; PUT takes a raw String body. The greenhouse SPA at /greenhouse
    calls ~12 api/v1 endpoints.
  evidence:
    - "src/poc/moss/src/api/v1/greenhouse.rs:200-476 — catalog merge logic"
    - "src/poc/moss/src/api/v1/greenhouse.rs:560-694 — file CRUD + reset semantics"
  gaps:
    - "Entire cluster is BARE (no ApiResponse) — including list endpoints whose siblings elsewhere are wrapped"
    - "put_file takes raw text with no size limit beyond the global 200MB body cap"
    - "running detection in catalog compares o.status.to_string() == 'running' (greenhouse.rs:301) — case-sensitive string compare against a Debug-ish format"
  maturity: live-proven
  v1: MISSING

- id: gateway-registration
  name: Gateway registration (orchestrators)
  kind: route-cluster
  what: >
    PUT /garden/gateway/{offering} lets orchestrators (mongo, etc.) register
    as gateways for offerings they front: an idempotent upsert into the tool
    registry with a 60s TTL (heartbeat every 30s), resolving connection URIs
    from a template + hostname/ip/port; DELETE deregisters and broadcasts
    removal. lease_id is deterministic ('gw-{offering}').
  how: >
    Validated that handler_for contains the path offering; builds a
    GardenTool with category defaulting to 'orchestrator'; registers with
    EntryOrigin::Gateway; registry reaper expires stale entries.
  evidence:
    - "src/poc/moss/src/api/v1/gateway.rs:22-24 — TTL constant"
    - "src/poc/moss/src/api/v1/gateway.rs:54-184 — upsert + projection publish"
  gaps:
    - "Bare response {lease_id,ttl_seconds}; DELETE returns a bare 200 even when nothing was registered (gateway.rs:206-209)"
    - "400 with EMPTY body on handler_for mismatch (returns Err(StatusCode) — no JSON at all)"
  maturity: live-proven
  v1: MISSING

- id: admin-console
  name: Admin & console (power, self-update, console mode)
  kind: route-cluster
  what: >
    Privileged ops, all unauthenticated: moss shutdown (cancellation token),
    take-root (Windows service install via sc.exe, with removable-media
    relocation to C:\ProgramData\ZenGarden), stone shutdown/reboot (delayed
    systemctl/shutdown spawn), Wake-on-LAN from cached topology MAC, and
    console verbosity mode (get/set with optional persist to moss-config.toml
    and a timeout auto-revert task).
  how: >
    Admin bodies are ad-hoc {success,message} / {success:false,error} JSON.
    Shutdown/reboot sleep 500ms then spawn OS commands so the response lands
    first. The self-update path: POST /stone/upgrade stages base64 binaries
    (arch-validated) and cancels the shutdown token so systemd restarts into
    the staged binary; POST /stone/deploy accepts a tar.gz package with
    X-Package-SHA256 verification, validates package.json/platform, stages
    bin/ + scripts/ + dependencies.json, stops companions on Windows and
    spawns the updater.
  evidence:
    - "src/poc/moss/src/api/v1/admin.rs:40-53,272-379 — shutdown/reboot/WoL"
    - "src/poc/moss/src/api/v1/stone.rs:90-271 — upgrade staging + self-restart"
    - "src/poc/moss/src/api/v1/stone.rs:283-767 — deploy package pipeline"
    - "src/poc/moss/src/api/v1/console.rs:58-79 — timeout revert spawn"
  gaps:
    - "No auth on any admin route (admin.rs:14 admits 'should be protected in production')"
    - "deploy uses blocking std::fs + tar in async context (stone.rs:386)"
    - "console persist writes ./moss-config.toml relative to CWD on Windows (console.rs:135-137)"
    - "stone_wake 500s map to a bare {success:false,error} shape unlike ApiErrorResponse"
  maturity: live-proven
  v1: MISSING

- id: pond-security
  name: Pond security & trust
  kind: route-cluster
  what: >
    The whole trust lifecycle, kept deliberately reachable over plain HTTP
    (bootstrap path): init (create CA + TOTP URI, optional generated
    XKCD passphrase), ceremony (step-wise koi ceremony protocol), join
    (TOTP + CSR-only enrollment — CA never sees the private key), invite
    (enrollment window), unlock (passphrase/TOTP; MyOrganization stays
    locked), renew, rename, promote (X25519 key exchange), untrust (revoke),
    remove, status (stones + own identity health incl. leaf expiry days),
    ca.pem download for manual trust install. Split listener model: HTTP
    :7185 lobby stays open for bootstrap/recovery; full API moves to HTTPS
    :7183; mutating stone/garden routes verify clear-signed envelopes
    (enforce_envelope middleware, gated by ZG_POND_ENFORCE).
  how: >
    All handlers delegate to koi-certmesh; CertmeshError maps to precise HTTP
    statuses (LOCKED, 429 with retry-after seconds, enrollment closed...).
    pond/sign exists as a loopback-only signing oracle on its own listener.
  evidence:
    - "src/poc/moss/src/bootstrap/router.rs:13-17,318-345 — lobby rationale comment"
    - "src/poc/moss/src/api/v1/pond.rs:200-254 — certmesh error mapping"
    - "src/poc/moss/src/api/v1/pond.rs:459-474 — loopback-only sign oracle doc"
    - "src/poc/moss/src/bootstrap/router.rs:376-379 — envelope enforcement middleware"
  gaps:
    - "Pond page + all pond routes unadvertised in the manifest"
    - "status identity health only; no garden-wide trust posture view"
  maturity: live-proven
  v1: MISSING

- id: logical-sets
  name: Logical sets (elected offering groups + bank sets)
  kind: route-cluster
  what: >
    ARCH-0038 first-class replication groups: /sets index (static kinds list),
    offering sets (same-FQN instances across stones where coordination=Elected
    and at least one running; role per member; orchestrator-registered
    uri_template preferred for connection strings), bank sets (same
    replica_set_name). Pure projections from the registry hotcache — no
    fan-out.
  how: >
    Membership walk deliberately avoids category pre-filtering (registry
    carries manifest categories, not the literal 'offering') — coordination
    lookup via catalog is the real gate (sets/offerings.rs:186-193).
  evidence:
    - "src/poc/moss/src/api/v1/sets/offerings.rs:86-162 — list + detail with uri_template preference"
    - "src/poc/moss/src/api/v1/sets/offerings.rs:347-398 — wire-shape pinning tests"
  gaps:
    - "No pagination; full registry walk per request (fine at garden scale)"
  maturity: live-proven
  v1: MISSING

- id: tools-registry-surface
  name: Garden tools registry & stream
  kind: route-cluster
  what: >
    The unified garden inventory: GET /garden/tools returns a cursor + tools
    (filter by fqid/category/status/capability selectors 'type:item') with
    optional delta replay since a cursor; /garden/tools/stream is SSE with
    snapshot + replay + live deltas + 15s heartbeats and Last-Event-ID (or
    ?since) resume mapping event ids back to cursors; /stone/tools/{fqid} is
    the singular lookup across Local/Gateway/Announced origins.
  how: >
    Deltas flow from the Tool aggregate's broadcast; SSE events carry
    event ids; capability filter syntax 'model:llama3,nomic-embed' parsed with
    400 INVALID_CAPABILITY_FILTER on malformed selectors.
  evidence:
    - "src/poc/moss/src/api/v1/tools.rs:97-204 — SSE composition (snapshot/replay/live/heartbeat)"
    - "src/poc/moss/src/api/v1/tools.rs:236-270 — capability selector parsing"
  gaps:
    - "/stone/tools/{fqid} returns BARE GardenTool while /garden/tools is wrapped — drift within one module"
    - "get_tool_v1 takes tools.pop() — last match wins, arbitrary if multiple stones hold the fqid"
  maturity: live-proven
  v1: MISSING

- id: updates-nourishment
  name: Nourishment (updates check/execute, stone + garden)
  kind: route-cluster
  what: >
    Check for offering (Docker registry) + firmware (fwupd/LVFS) updates with
    hardware-constraint blocking; execute by scope (all/offerings/firmware;
    moss self-update handled separately via stone/deploy); garden variants
    fan out to all stones in parallel (query each /stone/updates, dispatch
    signed execute to affected ones) and report per-stone job ids. SSE
    /stone/updates/stream/{job_id} for progress.
  how: >
    Garden execute first polls every stone's check endpoint, filters to
    stones with scope-matching updates, then signs and POSTs execute to each;
    per-stone result carries state Running/Failed/Unreachable.
  evidence:
    - "src/poc/moss/src/api/v1/updates.rs:107-138 — parallel check fan-out"
    - "src/poc/moss/src/api/v1/updates.rs:281-378 — signed dispatch, serialize-once sign-same-bytes"
  gaps:
    - "UpdateScope::Moss maps to (false,false) — silently no-ops in execute_stone (updates.rs:435)"
    - "garden/updates silently drops unreachable stones from the response (no per-stone status)"
  maturity: live-proven
  v1: MISSING

