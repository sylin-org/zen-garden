# ============================ CROSS-CUTTING SUBSYSTEMS ============================

- id: rake-connection-attachment-cascade
  name: connection / attachment cascade (RAKE-0011)
  kind: subsystem
  category: core
  flags: ["--at <stone|url|host:port|name>", "--fresh (clear cached tending)", "env GARDEN_STONE / ZG_STONE"]
  endpoint: "GET {target}/health (800ms probes); GET /api/v1/stone/capabilities/core (name resolution); GET {lantern}/api/v1/stones (fallback)"
  what: >
    Three-layer resolution stack: Layer 3 resolution (--at > GARDEN_STONE env > cached
    .tending > UDP auto-discovery, each with provenance Origin Flag/Env/Tending/Discovered
    and is_soft() recovery policy); Layer 2 Stone bind (endpoint + client + lazy StoneBag,
    seeded from tending capabilities when available); Layer 1 Resilient wrapper (on
    TCP-level connect/timeout failure of a soft origin: flush tending, re-resolve, retry
    once; HTTP errors never trigger recovery). Target forms: full URL, host:port,
    host.local, dotted host (https probe first when enrolled), bare stone name
    (cache → mDNS https/http → UDP sweep name/id match → Lantern).
  how: >
    dispatch::Runtime::execute resolves → binds → wraps every requires_endpoint command;
    contexts sign mutating requests through the LOCAL moss loopback sign oracle
    (http://127.0.0.1:{MOSS_SIGN_LOOPBACK}/api/v1/pond/sign) with audience bound to the
    target stone name; unknown stone name sends unsigned. mTLS identity loaded from
    enrollment certs into the shared reqwest client at startup (main.rs:119-137).
  rendering: discovery/flush messages via status indicators; stone name banner before command output (skipped in JSON mode or when show_stone_header=false).
  evidence:
    - "connection.rs:1-11 — layer doc"
    - "connection/resolution.rs:71-195 — resolve cascade + failed_endpoint flush"
    - "connection/resolution.rs:207-373 — resolve_target name cascade"
    - "connection/resilient.rs:54-121 — Resilient.execute + is_connection_failure"
    - "connection/stone.rs:25-75 — Stone bind/seed"
    - "dispatch.rs:78-150 — Runtime.execute"
    - "context.rs:76-94 — PondSigning oracle wiring"
    - "main.rs:104-137 — pooled client, X-Quiet header, mTLS"
  gaps:
    - "Legacy parallel path tending::execute_on_stone (3s-delayed discovery race, auto-tend on fallback) still used by observe/nourish/election/offer-placement alongside the newer Resilient path — two recovery regimes coexist"
    - "is_connection_failure treats reqwest timeouts as connection failures, which can re-resolve on slow (not dead) stones"
  maturity: live-proven
  v1: yes
  v1_note: >
    v1 main.rs re-implements the same cascade (Origin enum, immediate_candidates phases 1-4,
    hard/soft provenance) — the PoC's most directly ported subsystem.

- id: rake-discovery-plane
  name: discovery (UDP broadcast + Lantern)
  kind: subsystem
  category: core
  flags: ["--fresh (bypass caches where supported)"]
  endpoint: "UDP broadcast on DISCOVERY_UDP port; GET {lantern}/api/v1/stones (LanternTopology)"
  what: >
    Garden-discovery crate re-exported as crate::discovery (DISC-0001): UDP broadcast sweep
    with streaming callbacks (discover_all_moss_stream[_async]), single-winner
    discover_moss[_auto], background Lantern discovery with cached endpoint, and a
    KnownStone cache (Discovery::get/insert by name/id) surfaced to rake through
    CachedStoneOps.
  how: >
    Used by observe fallback, name resolution, offer --at anywhere, watch stone logs,
    election/offer-placement via execute_on_stone.
  rendering: n/a (infrastructure).
  evidence:
    - "discovery.rs:1-9 — re-export shim + DISC-0001 pointer"
    - "stone_cache.rs:14,46-80 — STONE singleton, STONE_ARC, CachedStoneOps impl, fetch_and_cache_stone"
    - "discovery_tests.rs:7-27 — UDP paths tested manually only"
  gaps:
    - "Discovery unit tests are a no-op placeholder (assert!(true)); UDP paths rely on manual testing"
  maturity: live-proven
  v1: yes
  v1_note: v1 replaces UDP broadcast with the v1 multicast/chirp plane (DISCOVERY_PORT_V1 / MULTICAST_GROUP_V1 in main.rs).

- id: rake-tending-cache
  name: tending cache (.tending)
  kind: subsystem
  category: core
  flags: ["tend ... writes", "tend --clear / --fresh clears", "--at overrides per-call"]
  endpoint: "local file {XDG_DATA_HOME|~/.zen-garden|/tmp/zen-garden}/.tending"
  what: >
    Persistent JSON TendingState {stone_name, endpoint, last_seen (ISO8601), cached
    capabilities}. No TTL: validity = reachability at use. Seeding from cached capabilities
    gives zero-HTTP hot path for name/banner; legacy files without capabilities tolerated.
    BOM-stripped read; XDG → home → /tmp fallback chain (Linux).
  how: >
    execute_on_stone (legacy path) auto-tends to fallback stones on success; Resilient path
    flushes on TCP failure instead.
  rendering: tend output lines; resolution warnings on flush.
  evidence:
    - "tending.rs:38-50 — state struct, no TTL"
    - "tending.rs:94-134 — dir priority + BOM strip"
    - "tending.rs:228-366 — execute_on_stone race"
    - "connection/resilient.rs:100-110 — bind_stone seeding"
  gaps:
    - "Manifest claims 90s persistence; reality indefinite (see rake-tend gaps)"
    - "/tmp/zen-garden fallback warns but is world-readable/writable shared state"
  maturity: live-proven
  v1: partial
  v1_note: v1 reads the same tending file concept (tending::read_from / default_path in v1 main.rs) but writes it via no PoC-style tend command.

- id: rake-stone-bag-and-cache
  name: stone_bag / stone_cache (identity headers + lazy capabilities)
  kind: subsystem
  category: core
  flags: []
  endpoint: "GET /api/v1/stone/capabilities/core (cold path, at most once per invocation)"
  what: >
    StoneBag: OnceCell-lazy capabilities bag per invocation; from_tending pre-seeds so
    stone_name/is_reachable cost zero HTTP. StoneIdentity extracts X-Stone-Name /
    X-Stone-Id injected by moss >= 0.48 on every response, letting callers identify stones
    without a dedicated call. stone_cache wires the garden-discovery cache into
    CachedStoneOps used by resolution and Resilient.
  how: >
    dispatch passes Some(&*STONE)/STONE_ARC into resolve/Resilient so discovered endpoints
    and names are cached process-wide.
  rendering: n/a.
  evidence:
    - "stone_bag.rs:40-137 — StoneBag lazy/seeded"
    - "stone_bag.rs:148-186 — extract_stone_identity (X-Stone-Id/Name headers)"
    - "stone_cache.rs:12-59 — STONE_ARC + trait impl"
  gaps:
    - "StoneIdentity/extract_stone_identity appears unused by command code (headers never read on hot paths) — capability present but unwired"
  maturity: code-complete-unsoaked
  v1: partial
  v1_note: v1 gets identity from chirp frames, not headers.

- id: rake-enrollment-mtls
  name: enrollment (pond client certs + mTLS + trust store)
  kind: subsystem
  category: core
  flags: []
  endpoint: "local cert store {data_dir}/koi/certs/{hostname}/{ca,cert,key}.pem; POST /api/v1/pond/sign (loopback oracle, via common)"
  what: >
    If enrolled (cert.pem+key.pem exist for this hostname), rake builds its reqwest client
    with the pond CA as root and the client cert/key as identity — every command speaks
