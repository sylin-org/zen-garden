container_name: ollama-cpu
image: ollama/ollama:0.5
ports:
  default: [11434, 11434]
volumes:
  - ollama-cpu-data:/root/.ollama
environment:
  OLLAMA_HOST: 0.0.0.0:11434
  # Force CPU-only: no GPU layers offloaded
  CUDA_VISIBLE_DEVICES: ""
  HIP_VISIBLE_DEVICES: ""
  ROCR_VISIBLE_DEVICES: ""
  # Limit to 1 loaded model (thin clients have limited RAM)
  OLLAMA_MAX_LOADED_MODELS: "1"
  # Keep model loaded for 10 minutes (reduce reload churn)
  OLLAMA_KEEP_ALIVE: "10m"
  # Enable flash attention for CPU path
  OLLAMA_FLASH_ATTENTION: "1"
  # Single parallel slot (thin client cannot handle concurrent model inference)
  OLLAMA_NUM_PARALLEL: "1"
# No GPU reservation — CPU-only container
# deploy:
#   resources:
#     reservations:
#       devices: []
deploy:
  resources:
    limits:
      # Default 2 GiB memory limit; operator should adjust via workspace_budget_mb
      memory: 2g
healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 30s
restart: unless-stopped
networks:
  - zen-garden
