version: "1"

compatibility_rules:
  - name: "gpu-required"
    condition:
      requires_ai_any: ['cuda']
    reason: "ComfyUI requires an NVIDIA GPU with CUDA support for image generation"
    suggestion: "Install on a stone with an NVIDIA GPU (RTX 3060+ recommended)"

  - name: "low-vram-warning"
    condition:
      vram_mb_less_than: 4096
    reason: "Most Stable Diffusion models require 4GB+ VRAM; Flux requires 12GB+"
    suggestion: "Use SD 1.5 models with 4GB VRAM. SDXL needs 8GB+, Flux needs 12GB+."
    warn_only: true

  - name: "insufficient-memory"
    condition:
      memory_mb_less_than: 8192
    reason: "ComfyUI requires at least 8GB RAM for model loading and inference"
    suggestion: "Increase stone memory to 16GB+ for comfortable operation"

  - name: "arm-not-supported"
    condition:
      architectures: ["armv7l", "armv6l"]
    reason: "ComfyUI Docker images are only available for amd64 and arm64"
    suggestion: "Use amd64 or arm64 hardware with NVIDIA GPU"

post_install_healthcheck:
  enabled: true
  scan_log_lines: 200
  timeout_seconds: 120
  patterns:
    - pattern: "CUDA.*error|cuda.*fail|RuntimeError.*CUDA"
      reason: "NVIDIA GPU initialization failed"
      suggestion: "Check NVIDIA drivers (550+) and nvidia-container-toolkit installation"

    - pattern: "Cannot allocate memory|OOM|OutOfMemoryError"
      reason: "Insufficient GPU memory for the loaded model"
      suggestion: "Use a smaller checkpoint or reduce image resolution"

    - pattern: "No such file or directory.*checkpoint"
      reason: "No model checkpoints found"
      suggestion: "Download a checkpoint to the comfyui-data volume: models/checkpoints/"
