# ComfyUI hardware compatibility (three-tier: NVIDIA → ROCm → CPU)
#
# Default image: yanwk/comfyui-boot:cu130-slim-v2 (NVIDIA CUDA 13.0)
# Fallback 1: yanwk/comfyui-boot:rocm (AMD ROCm 7.2, RDNA 2/3/4)
# Fallback 2: yanwk/comfyui-boot:cpu (CPU-only, very slow)

compatibility_rules:
  # No NVIDIA GPU — check if AMD GPU available for ROCm fallback
  - name: "no-nvidia-use-rocm"
    when:
      - host.ai.runtime LACKS cuda
      - host.ai.runtime HAS rocm
    reason: "No NVIDIA GPU detected. Using AMD ROCm image for GPU-accelerated inference."
    fallback:
      image: "yanwk/comfyui-boot:rocm"
      name: "rocm"

  # AMD GPU on Windows — DirectML detected but ROCm unavailable via Docker Desktop
  - name: "windows-amd-rocm-hint"
    when:
      - host.ai.runtime LACKS cuda
      - host.ai.runtime HAS directml
    reason: "AMD GPU detected but ROCm is not available through Docker Desktop."
    suggestion: "Install Docker CE inside WSL2 with ROCDXG to enable GPU-accelerated inference. See: https://github.com/ROCm/librocdxg"
    warn_only: true
    continue: true

  # No GPU at all — CPU fallback (very slow, but functional)
  - name: "no-gpu-use-cpu"
    when:
      - host.ai.runtime LACKS cuda
      - host.ai.runtime LACKS rocm
    reason: "No GPU runtime available. ComfyUI will run on CPU (very slow — expect minutes per image)."
    fallback:
      image: "yanwk/comfyui-boot:cpu"
      name: "cpu"

  - name: "low-vram-warning"
    when:
      - host.gpu.vram.total.mb < 4096
    reason: "Most Stable Diffusion models require 4GB+ VRAM; Flux requires 12GB+"
    suggestion: "Use SD 1.5 models with 4GB VRAM. SDXL needs 8GB+, Flux needs 12GB+."
    warn_only: true
    continue: true

  - name: "insufficient-memory"
    when:
      - host.ram.total.mb < 8192
    reason: "ComfyUI requires at least 8GB RAM for model loading and inference"
    suggestion: "Increase stone memory to 16GB+ for comfortable operation"

  - name: "arm32-not-supported"
    when:
      - host.architecture IN (armv7l,armv6l)
    reason: "ComfyUI Docker images require amd64"
    suggestion: "Use amd64 hardware with NVIDIA or AMD GPU"

post_install_healthcheck:
  enabled: true
  scan_log_lines: 200
  timeout_seconds: 120
  patterns:
    - pattern: "CUDA.*error|cuda.*fail|RuntimeError.*CUDA"
      reason: "NVIDIA GPU initialization failed"
      suggestion: "Check NVIDIA drivers (550+) and nvidia-container-toolkit"
      fallback:
        image: "yanwk/comfyui-boot:cpu"
        name: "cpu"

    - pattern: "HIP.*error|hip.*fail|ROCm.*error"
      reason: "AMD ROCm GPU initialization failed"
      suggestion: "Check ROCm drivers (6.4+) and /dev/kfd /dev/dri permissions"
      fallback:
        image: "yanwk/comfyui-boot:cpu"
        name: "cpu"

    - pattern: "Cannot allocate memory|OOM|OutOfMemoryError"
      reason: "Insufficient GPU memory for the loaded model"
      suggestion: "Use a smaller checkpoint or add --lowvram to CLI_ARGS"

    - pattern: "No such file or directory.*checkpoint"
      reason: "No model checkpoints found"
      suggestion: "Download a checkpoint to the comfyui-models volume under models/checkpoints/"
