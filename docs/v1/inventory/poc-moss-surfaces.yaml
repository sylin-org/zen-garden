  evidence:
    - "src/poc/moss/src/api/v1/companions.rs:95-126 — command + 'all' broadcast"
    - "src/poc/moss/src/api/v1/companions.rs:258-364 — signed parallel fan-out"
    - "src/poc/moss/src/domain/companion/mod.rs:1-13 — thin domain holder"
  gaps:
    - "send_companion_command returns BARE CommandResponse (companions.rs:99) — envelope drift; errors also carry CommandResponse bodies"
    - "Auto-start-on-command means a GET-like POST mutates process state silently"
