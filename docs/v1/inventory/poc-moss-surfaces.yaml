- id: health-self-description
  name: Health & self-description (/, /health, /api/v1/manifest)
  kind: route-cluster
  what: >
    Industry-standard liveness plus a handwritten API manifest. /health runs
    docker/disk/memory checks plus an initialization component (hardware
    detection + catalog readiness), aggregates to healthy/degraded/unhealthy,
    and maps unhealthy to HTTP 503. /api/v1/manifest returns a static
    ApiManifest (version, base_url, categories, endpoint specs with curl
    examples) built in code.
  how: >
    get_health collects resources ONCE and derives disk+memory checks and
    components from that snapshot (health.rs:20-44). The manifest is a
    hand-maintained list of EndpointSpec pushes in build_manifest() — not
    generated from the router, so it rots silently (v1's Face enum exists
    precisely to kill this pattern).
  evidence:
    - "src/poc/moss/src/api/v1/health.rs:15-126 — 503-on-unhealthy, components+legacy checks"
    - "src/poc/moss/src/api/v1/manifest.rs:25-429 — handwritten endpoint list"
    - "src/v1/crates/moss/src/http.rs:45-110 — v1 Face::ALL declared-once manifest, router built FROM it"
  gaps:
    - "Manifest advertises 27 unique paths; 7 are pre-/stone-nesting ghosts that 404 (/capabilities, /resources, /api/v1/offerings, /api/v1/offerings/search, /api/v1/offerings/:name, /api/v1/services, /api/v1/services/:service/logs) — manifest.rs:41,52,124,136,163,176,189"
    - "~195 of ~215 routed method-pairs are unadvertised; presence/stream is advertised twice (manifest.rs:240 and :301)"
    - "Manifest itself is served BARE (Json<ApiManifest>) while most v1-era responses are wrapped"
  maturity: live-proven
  v1: yes
  v1_note: >
    v1's /api/v1 front door is the fix: routes exist only as Face::ALL rows and
    the router is built from them, with tests (front_door_lists_every_face_exactly_once)
    making drift structurally impossible.

- id: portrait-page
  name: Portrait page (/ + /api/v1/stone/portrait*)
  kind: page
  what: >
    The operator's dashboard SPA. /api/v1/stone/portrait aggregates identity
    (name, derived color, role hard-coded "STONE"), foundation resources,
    offerings, storage, topology — explicitly cache-only, target <10ms, no I/O
    in the handler. /portrait/guidance returns combined offering guidance as
    markdown with an ETag (204 when nothing has guidance).
  how: >
    portrait.html (Alpine.js) polls /api/v1/stone/portrait, subscribes
    /api/v1/stone/presence/stream for live updates, fetches
    /api/v1/stone/storage/health, and buttons fire POSTs to
    /stone/services/{name}/(wake|rest|restart), /stone/storage/add,
    /stone/storage/{name}/release, /stone/companions/{id}/(up|down).
  evidence:
    - "src/poc/moss/src/api/v1/portrait.rs:362-376 — cache-only contract comment"
    - "src/poc/moss/src/api/v1/portrait.rs:699-756 — guidance markdown + ETag"
    - "src/poc/moss/assets/portrait.html:660,1115-1222,1322-1371 — endpoints consumed"
  gaps:
    - "role is hard-coded to STONE (portrait.rs:377-379) — Lantern/cornerstone roles TODO"
    - "io_percent: 0.0 placeholder 'until I/O collection is implemented' (presence.rs:248)"
  maturity: live-proven
  v1: MISSING
  v1_note: >
    v1 has no UI page and no portrait aggregate; the nearest v1 thing is
    /api/v1/stone (SelfView). A v1 dashboard would compose SelfView + posture.

- id: pulse-presence-events
  name: Pulse firehose + presence stream + events/SSE
  kind: route-cluster
  what: >
    One unified broadcast channel (state.pulse) fed by two producers
    (PulseDomainBridge for domain events, TransportTap for raw UDP). Three SSE
    consumers: /pulse/stream (everything: pulse.snapshot then domain.* +
    transport.* events), /presence/stream (domain-only, translated to
    companion vocabulary, ?categories filter), /metrics/stream (transitions
    only). Plus /presence snapshot GET and /presence/notify POST (only
    event_type "tended" accepted).
  how: >
    Every stream takes a shutdown child token (MOSS-0004) so graceful drain
    doesn't hang; lagged receivers are dropped with a warn. Presence snapshot
    assembles offering states, resource percents, GPU/net rates, seed-bank
    summary and local hour — the Firefly LED data contract (FIREFLY-0003).
  evidence:
    - "src/poc/moss/src/infra/listeners/pulse.rs:1-100 — PulseEvent::Domain|Transport union"
    - "src/poc/moss/src/api/v1/pulse.rs:45-111 — firehose + server.shutdown sentinel event"
    - "src/poc/moss/src/api/v1/presence.rs:50-129,140-144,295-329 — filtered stream, snapshot, notify"
  gaps:
    - "/presence/notify rejects everything but 'tended' with a BARE text error (presence.rs:306-310)"
    - "Snapshot generate_snapshot() does fresh Date/time math per call; no ETag"
    - "events.rs in api/v1/ registers NO routes — it is job-event emit helpers (naming trap)"
  maturity: live-proven
  v1: MISSING
  v1_note: >
    v1 has no SSE/event surface at all. First migration target: the unified
    pulse channel + presence vocabulary (companions depend on it).

- id: observability-metrics-tasks-logs
  name: Observability (metrics aggregate, task supervisor, daemon logs, maintenance)
  kind: route-cluster
  what: >
    ARCH-0018 software observability: per-domain event counters and mutation
    latency, per-task timing/lag, global counters, and an SSE of interesting
    transitions only (counter increments must be polled). Separate lifecycle
    view at /stone/tasks[/{name}] from the SupervisorHandle (the two are
    explicitly complementary and joined by name). Daemon logs: file-backed
    recent-lines (?lines≤5000&level substring) + live SSE tail. Maintenance:
    sweep history + on-demand sweep.
  how: >
    All metrics handlers are thin dispatchers over Arc<Metrics> via FromRef
    extraction. 404s (unknown domain/task) use a raw {error,message} shape
    distinct from ApiErrorResponse. /stone/logs reads
    {logs_dir}/garden-moss.log.{today} picking the most recently modified.
  evidence:
    - "src/poc/moss/src/api/v1/metrics.rs:1-164 — full snapshot + SSE"
    - "src/poc/moss/src/bootstrap/router.rs:1181-1230 — task lifecycle handlers inline in router.rs"
    - "src/poc/moss/src/api/v1/logs.rs:30-81 — file read with level substring filter"
    - "src/poc/moss/src/api/v1/maintenance.rs:15-39 — sweep history/trigger"
  gaps:
    - "logs level filter is substring contains() not severity-aware (logs.rs:63-72)"
    - "log read loads the whole file into a String before tailing (logs.rs:53)"
    - "404 error shape drift: {error,message} (metrics.rs:73-80) vs ApiErrorResponse elsewhere"
  maturity: live-proven
  v1: MISSING
  v1_note: >
    v1's posture face has a handful of live counters but nothing like the
    Metrics aggregate, task registry, or log access.

- id: garden-ops
  name: Garden ops (overview, topology, inspect, recommend, placement)
  kind: route-cluster
  what: >
    Garden-wide reads composed locally: /garden (self + cached peers with live
    resources only for self), /garden/topology (raw TopologyEntry list, self
    first), /garden/capabilities (Tier1 from cache, peers' Tier2 = None),
