[package]
name = "garden-common"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# Reduced from "full" - library needs: sync, time, fs (for atomic file ops), net (for UDP sockets), process (for archive/detection)
tokio = { version = "1.35", features = ["sync", "time", "macros", "fs", "io-util", "net", "process", "signal"] }
mdns-sd = "0.11"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0"
async-trait = "0.1"
async-stream = "0.3"
tokio-stream = "0.1"
futures = "0.3"
uuid = { version = "1.6", features = ["v7"] }
blake3 = "1.5"
tracing = "0.1"
socket2 = "0.5"
local-ip-address = "0.6"
sysinfo = "0.30"
once_cell = "1.19"
colored = "2.1"
terminal_size = "0.3"
supports-color = "3.0"
regex = "1.10"
walkdir = "2.4"
rand = "0.8"
network-interface = "2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }
windows = { version = "0.52", features = ["Win32_Graphics_Dxgi"] }

[dev-dependencies]
tempfile = "3.8"

[lib]
path = "src/lib.rs"
