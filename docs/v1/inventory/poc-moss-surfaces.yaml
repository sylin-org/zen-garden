    - "peers always report cpu/memory 0.0 (no per-peer resource fetch)"
    - "pond_status field hard-wired None 'Phase 3' (garden.rs:68)"
  maturity: live-proven
  v1: partial
  v1_note: >
    v1 /api/v1/garden/stones projects the same self-spliced room from the
