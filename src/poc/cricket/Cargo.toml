[package]
name = "garden-cricket"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "garden-cricket"
path = "src/main.rs"

[features]
# Default links the rodio backend (→ libasound on Linux). Disable for a headless / target-agnostic
# build where no libasound exists (aarch64-musl / Android): build `--no-default-features`, which
# selects the null audio backend (cricket runs as a companion, playback is a no-op).
default = ["audio-rodio"]
audio-rodio = ["dep:rodio"]

[dependencies]
garden-common = { path = "../common" }
garden-companion-sdk = { path = "../companion-sdk" }

# Core
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "signal", "sync"] }
tokio-util = "0.7"
tracing.workspace = true
tracing-subscriber.workspace = true

# Config & CLI
clap = { workspace = true, features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true

# HTTP client for SSE
reqwest = { workspace = true, features = ["stream"] }
futures-util = "0.3"
tokio-stream = "0.1"

# Audio playback (optional — see [features]). The default backend links libasound on Linux.
rodio = { version = "0.18", optional = true }

# Embedded assets
rust-embed = "8"

# File watching (for sample library hot-reload)
notify = "8"

# Terminal UI for test mode
crossterm = "0.27"
