- id: companions
  name: Companions (Cricket/Firefly/OLED) + command passthrough
  kind: route-cluster
  what: >
    Registry of hardware companions with manifest-driven command sets:
    list (running/pid), per-companion manifest detail, command proxy (forwards
    to the companion's localhost HTTP port /command with 5s timeout,
    auto-starting it first), up/down lifecycle (up also enables boot
    auto-start; down persists disable), and refresh re-scan. First arg "all"
