version: "1"

compatibility_rules:
  - name: "no-gpu-info"
    condition:
      requires_ai_any: ['cuda']
    reason: "Speaches performs best with GPU acceleration (10-50x faster for large models)"
    suggestion: "No GPU detected. Use the CPU image (speaches:latest-cpu) or small models (tiny, base)."
    warn_only: true

  - name: "low-vram-warning"
    condition:
      vram_mb_less_than: 2048
    reason: "Whisper large-v3 requires ~3GB VRAM; medium requires ~2.6GB"
    suggestion: "Use smaller models: tiny (~400MB), base (~500MB), small (~1GB)"
    warn_only: true

  - name: "insufficient-memory"
    condition:
      memory_mb_less_than: 2048
    reason: "Speaches with whisper models requires at least 2GB RAM"
    suggestion: "Increase stone memory or use the tiny model"

  - name: "arm32-not-supported"
    condition:
      architectures: ["armv7l", "armv6l"]
    reason: "Speaches Docker images require amd64 or arm64"
    suggestion: "Use amd64 or arm64 hardware"

post_install_healthcheck:
  enabled: true
  scan_log_lines: 100
  timeout_seconds: 60
  patterns:
    - pattern: "CUDA.*error|cuda.*fail"
      reason: "GPU initialization failed"
      suggestion: "Check NVIDIA drivers and nvidia-container-toolkit. Use the CPU image as fallback."

    - pattern: "Cannot allocate memory|OOM"
      reason: "Insufficient memory for whisper model"
      suggestion: "Use a smaller model: set WHISPER__MODEL to Systran/faster-whisper-tiny"

    - pattern: "Connection.*refused|Failed to download"
      reason: "Model download failed"
      suggestion: "Check internet connectivity. Pre-download models to the speaches-models volume."
