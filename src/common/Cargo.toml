[package]
name = "garden-common"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yml.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "fs", "io-util", "net", "process", "signal"] }
chrono = { workspace = true, features = ["serde"] }
thiserror.workspace = true
reqwest = { workspace = true, features = ["json", "webpki-roots"] }
anyhow.workspace = true
async-stream.workspace = true
tokio-stream.workspace = true
futures.workspace = true
futures-util.workspace = true
uuid.workspace = true
blake3.workspace = true
tracing.workspace = true
socket2.workspace = true
if-addrs.workspace = true
sysinfo.workspace = true
regex.workspace = true
netstat2 = "0.11"
walkdir.workspace = true
rand.workspace = true
urlencoding.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO"] }
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dxgi"] }

[dev-dependencies]
tempfile.workspace = true
proptest = "1"
# axum + tokio test runtime: spin up a real HTTP fixture for the
# StoneApi integration tests (`tests/garden_storage_api.rs`). Real
# axum, real reqwest, real wire format — no mocks per the project's
# integration-test rule.
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# garden-discovery in dev-deps so the live-garden tests
# (`tests/garden_storage_live.rs`) can auto-discover running Moss
# instances without requiring `ZG_TEST_STONE` to be set. Dev-only
# dep avoids inverting the discovery → common dependency direction
# in non-test builds.
garden-discovery = { path = "../discovery" }

[lints]
workspace = true

[lib]
path = "src/lib.rs"
