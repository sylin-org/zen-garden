kind: software
name: elasticsearch
category: search
description: Elasticsearch search and analytics engine (AGPL/SSPL licensed)
tags: [search, database, document, analytics, full-text, vector]
# connection template from PoC frontmatter (not consumed yet): http://{host}:{port}
# host kernel requirement (frontmatter requires_sysctl): vm.max_map_count=262144

managed:
  world: oci
  image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
  ports: { default: 9200, transport: 9300 }
  volumes:
    - { name: elasticsearch-data, mount: /usr/share/elasticsearch/data }
  env:
    discovery.type: single-node
    xpack.security.enabled: "false"
    ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    cluster.name: zen-garden-es
  healthcheck:
    exec: ['CMD-SHELL', 'curl -s http://localhost:9200/_cluster/health?local=true | grep -q ''"status":"green"\|"status":"yellow"'' || exit 1']
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s
  restart: unless-stopped

compatibility:
  - name: arm32-not-supported
    when:
      - { path: machine.architecture, op: in, value: [armv7l, armv6l] }
    decide: deny
    because: "Elasticsearch does not provide official ARM32 Docker images"
    suggest: "Use OpenSearch (has ARM32 community images) or PostgreSQL with full-text search"
  - name: insufficient-memory
    when:
      - { path: ram.total.mb, op: lt, value: 2048 }
    decide: deny
    because: "Elasticsearch JVM requires at least 2GB RAM for stable operation"
    suggest: "Increase stone memory, or use OpenSearch/PostgreSQL depending on the use-case"
  # PoC warn_only rule -> decide: place (warn semantics preserved in the name)
  - name: low-memory-warning
    when:
      - { path: ram.total.mb, op: lt, value: 4096 }
    decide: place
    because: "Elasticsearch performs best with 4GB+ RAM (2GB heap + filesystem cache)"
    suggest: "Consider increasing RAM for production workloads"

# living will: flush before the imprint window; the flushed state
# is consistent under no-writes.
capture:
  mode: lock-and-copy
  quiesce:
    exec: [curl, -fsS, -XPOST, http://localhost:9200/_flush]
  max_locked_s: 120
