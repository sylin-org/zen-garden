[package]
name = "garden-moss"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "garden-moss"
path = "src/main.rs"

[dependencies]
garden-common = { path = "../common" }
koi-embedded.workspace = true
koi-common.workspace = true
koi-certmesh.workspace = true
koi-crypto.workspace = true

# Core
anyhow.workspace = true
chrono.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v5", "v7"] }
rand.workspace = true
regex.workspace = true

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "net", "signal", "process", "fs", "sync", "time", "macros"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = "0.7"
async-stream.workspace = true
futures-util.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yml.workspace = true
toml = "0.8"

# HTTP / server
axum.workspace = true
reqwest = { workspace = true, features = ["json", "webpki-roots", "rustls", "query"] }
tower = "0.5"
tower-http = { workspace = true, features = ["trace", "cors"] }

# TLS
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
# Bundled CA roots: reqwest 0.13 + rustls defaults to rustls-platform-verifier (OS trust
# store), which fails on hosts without one (Android/bionic). We supply webpki roots
# explicitly via a preconfigured rustls client config (see src/http.rs).
webpki-roots = "1"

# CLI
clap = { workspace = true, features = ["derive", "env"] }

# Observability
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Docker — moss owns its own bollard; koi 0.4's lean build pulls none
bollard = "0.20"

# Crypto / hashing
blake3.workspace = true
base64.workspace = true
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.10"
argon2 = "0.5"

# Networking
socket2.workspace = true
hostname.workspace = true
url.workspace = true
urlencoding.workspace = true

# System
sysinfo.workspace = true
walkdir.workspace = true
dashmap = "6"
cron = "0.15"

# Hardware topology (ARCH-0014 Tier 2)
smbios-lib = "0.9"
nusb = "0.2"
pci-ids = "0.2"

# WebDAV server (STORAGE-0009 Phase 3)
dav-server = "0.11"

# Filesystem watcher — detect external writes for replication (STORAGE-0009 Phase 5)
notify = "8"

# S3 gateway
quick-xml = { version = "0.39", features = ["serialize"] }
md5 = "0.8"
hex = "0.4"
mime_guess.workspace = true

# Embedded assets (manifests + default Companions)
rust-embed.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging"
] }
windows = { version = "0.52", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_CloudFilters",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_SystemInformation",
    "UI_Notifications",
    "Data_Xml_Dom",
] }
wmi = "0.14"
winreg = "0.52"

# `udev` is optional (default-on) so the storage monitor's udev fast-path can be compiled
# out for a fully-static musl build targeting Android/bionic, where libudev is unavailable.
# With the feature off, the monitor's existing polling fallback handles device add/remove.
[features]
default = ["udev"]
udev = ["dep:udev"]

[target.'cfg(unix)'.dependencies]
udev = { version = "0.9", optional = true }
libc = "0.2"
sd-notify = "0.4"

[dependencies.tempfile]
version = "3"

# Archive extraction — in-process with per-entry path validation (BUILD-0004)
[dependencies.tar]
version = "0.4"

[dependencies.flate2]
version = "1"

[lints]
workspace = true

# Cloud Filter (cloud-filter, nt-time) and its sole-purpose Windows-API
# features moved to garden-pavilion per PAVILION-0001. wmi / winreg /
# windows / windows-sys remain — they're used by hardware topology
# detection (infra/topology/*), shell integration, and platform/registry.

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
garden-build-utils = { path = "../build-utils" }
embed-resource = "3"
