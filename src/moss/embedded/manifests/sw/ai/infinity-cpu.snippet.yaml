container_name: infinity
image: michaelf34/infinity:latest-cpu
ports:
  default: [7997, 7997]
volumes:
  - infinity-models:/app/.cache
environment:
  HF_HOME: "/app/.cache"
  INFINITY_ANONYMOUS_USAGE_STATS: "0"
command: ["v2", "--model-id", "BAAI/bge-small-en-v1.5", "--port", "7997", "--engine", "optimum"]
healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:7997/health"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 120s
restart: unless-stopped
networks:
  - zen-garden
