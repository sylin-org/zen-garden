---
# Ollama Adopted Mode Manifest
# Detects and manages native Ollama installations
#
# Installation:
#   Windows: https://ollama.com/download/windows
#   Linux:   curl -fsSL https://ollama.com/install.sh | sh
#   macOS:   https://ollama.com/download/mac

name: ollama
description: Ollama local LLM runtime (native installation)
category: ai
modes:
  - adopted
tags:
  - ai
  - llm
  - inference
  - models
  - gpu
  - cuda
  - rocm
  - local-ai

# Detection rules (multi-layered approach, OS-specific)
#
# Structure: detection → {os} → [method configs]
# Moss loads only the rules for current OS, making detection fast and maintainable
#
# How Moss interprets these rules (using vitality model):
#   Rule 1 PASS only  → Ollama installed but NOT running (vitality: DORMANT - can awaken if control=full)
#   Rule 1+2 PASS     → Ollama installed AND running (vitality: THRIVING)
#   Rule 1+2+3 PASS   → Ollama fully operational (vitality: THRIVING, API confirmed)
#   All FAIL          → Ollama not installed (not adopted)
#
# Vitality states for adopted offerings:
#   - THRIVING: Service is running and operational
#   - DORMANT:  Service is installed/detected but not currently running (not an error!)
#
detection:
  windows:
    # Rule 1: Detect if Ollama is INSTALLED (passes whether running or not)
    # Output when NOT running: "Warning: could not connect to a running Ollama instance\nWarning: client version is 0.15.0"
    # Output when running: "ollama version is 0.15.0"
    - method: command
      config:
        command: ollama --version
        # Pattern matches BOTH scenarios (extracts version number)
        # - "ollama version is 0.15.0" (running)
        # - "client version is 0.15.0" (not running but installed)
        expected_pattern: "version is ([0-9]+\\.[0-9]+\\.[0-9]+)"
        expected_exit_code: 0
      stability_threshold: 1  # Immediate (binary doesn't change)
      cache_ttl_secs: 3600    # Cache for 1 hour (installation is stable)

    # Rule 2: Detect if Ollama is RUNNING (distinguishes running from installed-but-stopped)
    # This rule will FAIL if we see "Warning: could not connect" (meaning needs launch)
    - method: command
      config:
        command: ollama --version
        # This pattern ONLY matches when service is running (no "Warning:")
        expected_pattern: "^ollama version is"
        expected_exit_code: 0
      stability_threshold: 1  # Require 2 consecutive successes
      cache_ttl_secs: 60      # Short cache (service can restart)

    # Rule 3: HTTP probe (additional confirmation service is responding)
    - method: http_probe
      config:
        url: http://localhost:11434/api/tags
        expected_status: 200
        timeout_ms: 2000
      stability_threshold: 1
      cache_ttl_secs: 60

  linux:
    # Rule 1: Installation detection
    - method: command
      config:
        command: ollama --version
        expected_pattern: "version is ([0-9]+\\.[0-9]+\\.[0-9]+)"
        expected_exit_code: 0
      stability_threshold: 1
      cache_ttl_secs: 3600

    # Rule 2: Running detection
    - method: command
      config:
        command: ollama --version
        expected_pattern: "^ollama version is"
        expected_exit_code: 0
      stability_threshold: 1
      cache_ttl_secs: 60

    # Rule 3: HTTP probe
    - method: http_probe
      config:
        url: http://localhost:11434/api/tags
        expected_status: 200
        timeout_ms: 2000
      stability_threshold: 1
      cache_ttl_secs: 60

  macos:
    # Rule 1: Installation detection
    - method: command
      config:
        command: ollama --version
        expected_pattern: "version is ([0-9]+\\.[0-9]+\\.[0-9]+)"
        expected_exit_code: 0
      stability_threshold: 1
      cache_ttl_secs: 3600

    # Rule 2: Running detection
    - method: command
      config:
        command: ollama --version
        expected_pattern: "^ollama version is"
        expected_exit_code: 0
      stability_threshold: 1
      cache_ttl_secs: 60

    # Rule 3: HTTP probe
    - method: http_probe
      config:
        url: http://localhost:11434/api/tags
        expected_status: 200
        timeout_ms: 2000
      stability_threshold: 1
      cache_ttl_secs: 60

# Control configuration (defines what Moss can do)
control:
  # Options:
  #   - full: Moss can start/stop/restart Ollama
  #   - monitor: Moss only observes (read-only)
  #   - announce: Moss just announces if running
  level: monitor  # Default: safe, read-only

  # Commands for 'full' control level
  # Uncomment and set level=full to enable Moss control
  
  # Windows start command (runs ollama serve in background)
  # start_command: powershell -Command "Start-Process -FilePath 'ollama' -ArgumentList 'serve' -WindowStyle Hidden"
  
  # Linux/macOS start command
  # start_command: ollama serve &
  
  # Windows stop command
  # stop_command: powershell -Command "Get-Process -Name 'ollama' | Stop-Process -Force"
  
  # Linux/macOS stop command
  # stop_command: pkill ollama
  
  # Health check URL (used for all control levels)
  health_check_url: http://localhost:11434/api/tags

# Connection template (for services that need to connect to Ollama)
connection_template: |
  {
    "base_url": "http://{{ host }}:{{ port }}",
    "api_endpoint": "http://{{ host }}:{{ port }}/api",
    "generate_endpoint": "http://{{ host }}:{{ port }}/api/generate",
    "embeddings_endpoint": "http://{{ host }}:{{ port }}/api/embeddings",
    "models_endpoint": "http://{{ host }}:{{ port }}/api/tags"
  }
