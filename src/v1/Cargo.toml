[workspace]
resolver = "2"
members = ["crates/glossary", "crates/contract", "crates/kernel", "crates/moss"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
garden-glossary = { path = "crates/glossary" }
garden-contract = { path = "crates/contract" }
garden-kernel = { path = "crates/kernel" }
garden-moss = { path = "crates/moss" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
if-addrs = "0.15"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
todo = "warn"
panic = "deny"

[profile.release]
strip = true
lto = "thin"
