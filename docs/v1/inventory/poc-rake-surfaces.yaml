# ============================ LIFECYCLE ============================

- id: rake-offer
  name: offer (alias: explore)
  kind: command
  category: Lifecycle
  flags: ["[offering] positional (omit=list; 'refresh'=refresh)", "sub: info", "sub: image <ref> [--instance <name>] [--info-only]", "--prefer <csv>", "--anywhere-on-fail", "--placement-mode interactive|auto", "--at (and --at anywhere)"]
  endpoint: >
    list: GET /api/v1/stone/offerings + GET /api/v1/stone/services; refresh: POST /api/v1/stone/offerings/refresh;
    info: GET /api/v1/stone/offerings/{name}; query/search: GET /api/v1/stone/offerings/search?q=&prefer=&limit=;
    install: POST /api/v1/stone/services then poll GET /api/v1/jobs/{job_id} (500ms, 5min);
    image info: GET /api/v1/stone/offerings/inspect?image=; image deploy: POST /api/v1/stone/services (image:<ref>[::<instance>]);
    placement: POST /api/v1/garden/recommend (pond-signed) + GET /api/v1/garden/topology; alternatives on compat-fail via search.
  what: >
    The install/list/search surface. Bare: category grid of offerings (incompatible filtered,
    fallback-tagged with * legend) + running services table. Named + known: install with
    job progress (percentage, elapsed, failure → non-zero exit), already-installed branch,
    400 COMPATIBILITY_FAILED → derived-query alternatives (+ --anywhere-on-fail garden sweep).
    Unknown name → top-3 server-scored recommendations. --at anywhere aggregates search
    across UDP-discovered stones with local prefer scoring (ssd/nvme/hdd). --placement-mode
    drives POST /garden/recommend: interactive ranked selection (compat icon, tended star,
    mem/cpu/storage metrics, exclusion summary) or quiet auto-install of top stone.
  how: >
    route_offer pre-resolves endpoint to decide known-offering vs query. Install payload
    {offering: fqn, ports: [], environment: {}}; job_id from structured field else prose
    "/api/jobs/<uuid>" fallback. Placement uses signed raw POST with audience=candidate name.
  rendering: >
    CategoryGrid multi-column list; install line "name  [status action]" + divider + SSE-less
    polling progress with \r updates; suggestions block from ApiResponse.suggestions; placement
    interactive [Y/n] / 1-N/q picker. No JSON mode.
  evidence:
    - "commands/offering/mod.rs:310-416 — print_offerings_index"
    - "commands/offering/mod.rs:688-875 — stream_job_progress polling"
    - "commands/offering/mod.rs:881-1244 — placement recommend interactive/quiet"
    - "commands/offering/mod.rs:1422-1699 — Install branch (dup-check, create, 400 alternatives)"
    - "commands/offering/mod.rs:1701-1834 — Image info/deploy (image:<ref>[::instance])"
    - "route.rs:712-818 — route_offer branching"
  gaps:
    - "Already-installed suggestions reference non-existent commands: garden-rake show / start / stop / restart (offering/mod.rs:1446-1470); real verbs are status/wake/rest"
    - "JSON mode unsupported for every offer action"
    - "install failure inside job polling correctly bails non-zero (added fix noted at mod.rs:800-808)"
  maturity: live-proven
  v1: yes
  v1_note: >
    v1 offer plants by catalog name or --image with --port NAME=PORT / --input KEY=VALUE /
    --runtime / --category. PoC offer loses --port/--input/--runtime (ports/environment
    hardcoded empty) but gains search, placement recommendation, image-inspect, alternatives.

