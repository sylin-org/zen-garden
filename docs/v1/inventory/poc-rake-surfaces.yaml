# ============================ DISCOVERY ============================

- id: rake-observe
  name: observe
  kind: command
  category: Discovery
  flags: ["[stone] positional filter", "--offering <comma-list>", "global: --fresh (handled, warns unsupported)"]
  endpoint: "GET /api/v1/garden/topology (via tending::execute_on_stone with mDNS fallback); fallback GET {lantern}/api/v1/stones"
  what: >
    Garden-wide overview table. Queries the tended stone's topology cache (chirp-populated),
    with parallel-discovery fallback to another stone and a final Lantern registry fallback.
    Renders NAME / OS / CORES / MEM / AI / OFFERINGS columns with vitality coloring,
    a summary header ("N stones, all thriving"), adaptive legend, and tended marker.
  how: >
    Local command (requires_endpoint=false). tending::execute_on_stone races tended stone
    vs delayed UDP discovery (3s delay, biased toward tended). Topology rows with no
    capabilities are skipped (verbose notes them). Offline stones force-classified dormant.
    Lantern path renders a degraded table (no hardware data, dashes).
  rendering: >
    Human table only. NO JSON mode (ignores ctx.output_format). Colors: gold tended name,
    green/yellow/red/gray vitality, emoji OS icons (or [W]/[L]), ─ dividers. Footer hint
    "garden-rake <stone>? for details". --fresh prints "Fresh mode not yet supported".
  evidence:
    - "commands/discovery/observe.rs:53-72 — Command impl, requires_endpoint=false"
    - "commands/discovery/observe.rs:142-264 — execute_on_stone + api.garden().observe()"
    - "commands/discovery/observe.rs:279-310 — Lantern fallback GET /api/v1/stones"
    - "commands/discovery/observe.rs:133-139 — --fresh warns 'not yet supported'"
    - "route.rs:122-129 — Inv::local"
  gaps:
    - "--fresh advertised via global flag + observe hint 'Try: garden-rake observe --fresh' but explicitly unsupported (observe.rs:133-139)"
    - "No JSON/--output json support despite global -o json flag"
    - "MANIFEST see_also references 'pulse' but suggestions system takes only first 3"
  maturity: live-proven
  v1: yes
  v1_note: >
    v1 observe exists but renders the v1 wire/cache garden (ChirpFrame GardenStone rows);
    PoC observe renders the topology-cache table. Same intent, different data plane.

- id: rake-pulse
  name: pulse
  kind: command
  category: Discovery
  flags: ["--at <stone>"]
  endpoint: "GET /api/v1/stone/pulse/stream (SSE firehose) + GET /api/v1/garden/topology polled every 10s"
  what: >
    Permanent full-screen terminal monitor: live gauges (CPU/MEM/DSK/GPU/NET), offerings
    status line, scrolling wire feed of domain.* + transport.* events, garden topology
    sidebar/summary, diagnostics footer (connected duration, evt/min, last chirp age).
    Auto-reconnects on stone restart; exits cleanly on server.shutdown.
  how: >
    Consumes SSE; pulse.snapshot hydrates PresenceSnapshot, domain.stone.load.updated updates
    gauges, transport.stone_chirp/election_*/storage_beacon/tools_beacon become wire lines with
    budget-fitted detail items. Frame buffer rendering: cursor-home, exact row budget (rows-1
    newlines), 250ms min redraw interval, single stdout write per frame. Layout: Split
    (wire | sidebar) >=79 cols, Stacked (wire + 2-per-row garden) >=50, Narrow below.
    Reconnect backoff 1s doubling to 30s; Ctrl+C restores cursor and exits.
  rendering: >
    Full-screen ANSI frame (ESC[2J once, then ESC[H overwrite). Color + unicode adaptive
    (unicode off by default on Windows unless GARDEN_UNICODE=1). ASCII fallbacks everywhere.
  evidence:
    - "commands/pulse.rs:299-399 — connect/reconnect loop, backoff, server.shutdown exit"
    - "commands/pulse.rs:402-473 — stream_loop select: SSE / topology tick / ctrl_c"
    - "commands/pulse.rs:480-529 — SSE dispatch (pulse.snapshot, domain.*, transport.*)"
    - "commands/pulse.rs:925-1052 — frame buffer composite + row budget"
    - "common/src/presence/event_types.rs:9 — PULSE_STREAM_PATH = /api/v1/stone/pulse/stream"
  gaps:
    - "No persistence/log export; ring buffer capped at 200 events"
    - "Wire feed newest-at-top (reversed); undocumented"
  maturity: live-proven
  v1: MISSING
  v1_note: v1 rake has no monitoring/live view at all.

- id: rake-watch
  name: watch
  kind: command
  category: Discovery
  flags: ["--until <string>", "at global", "sub: offering <name> logs [--timestamps]", "sub: stone <name> logs [--timestamps]"]
  endpoint: "GET /api/v1/stone/presence/stream (SSE, bare watch); GET /api/v1/stone/services/{name}/logs?timestamps=true (SSE, offering logs)"
  what: >
    Streams live stone events (with --until exit-on-pattern) or offering container logs.
    Log lines colorized red for stderr; events rendered "[HH:MM:SS] <symbol> message" with
    level symbols i/!/x/*/o.
  how: >
    Bare watch consumes presence stream SSE. `watch stone <name> logs` re-resolves the stone
    by UDP discovery + capabilities name match, then... is a stub (see gaps). `logs` command
    delegates to watch offering logs (route.rs:133-140).
  rendering: >
    Plain streaming text; SSE parsed manually; error events prefixed "!". No JSON.
  evidence:
    - "commands/discovery/watch.rs:216-305 — watch_events with until-pattern exit"
    - "commands/discovery/watch.rs:126-202 — offering logs SSE with stderr coloring"
    - "route.rs:143-174 — watch subcommand routing"
