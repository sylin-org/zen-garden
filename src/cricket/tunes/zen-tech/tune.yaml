# Zen Tech - Digital Tune
# Clean digital audio feedback for garden presence

name: zen-tech
version: "1.0.0"
description: Clean digital cues for garden stone presence
author: Zen Garden Team
license: CC0

# Fallback sound when a mapped resource is not found
fallback: _shared/loading-chime.mp3

events:
  # Initial presence snapshot - plays when Cricket connects to SSE
  presence.snapshot:
    resource: samples/beep-positive.mp3
    channel: foreground
    debounce_ms: 30000

  # Service lifecycle events
  service.started:
    resource: samples/success-synth.mp3
    channel: midground
    debounce_ms: 2000

  service.stopped:
    resource: samples/telephone-dock-beep.mp3
    channel: midground
    debounce_ms: 2000

  # Stone health events
  stone.health.changed:
    resource: samples/beep-sound-onoff.mp3
    channel: background
    debounce_ms: 5000

  stone.tended:
    resource: samples/wind-chime-single-04.mp3
    channel: foreground
    debounce_ms: 10000

  # Storage events (seed bank lifecycle)
  storage.detected:
    resource: samples/computer-chimes.mp3
    channel: foreground
    debounce_ms: 3000

  storage.prepared:
    resource: samples/success-synth.mp3
    channel: foreground
    debounce_ms: 1000

  storage.released:
    resource: samples/telephone-dock-beep.mp3
    channel: midground
    debounce_ms: 1000

  storage.removed:
    resource: samples/beep-oops.mp3
    channel: midground
    debounce_ms: 1000

  storage.pool_conflict:
    resource: samples/alert-short.mp3
    channel: foreground
    debounce_ms: 5000
