# Vaultwarden — Bitwarden-compatible password/secrets vault (Rust). AGPL-3.0.
# Multi-arch (amd64/arm64/armv7/armv6). All state (SQLite DB, the JWT RSA keypair,
# attachments, sends, icon cache, config) lives under /data — one host volume
# externalizes everything for backup. The RSA keypair is as critical as the DB.
container_name: vaultwarden
image: vaultwarden/server:1.36.0
ports:
  default: [80, 80]
environment:
  # Allow registering the first account; lock down after (see guidance).
  SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED:-true}"
volumes:
  - vaultwarden-data:/data
# curl is present in the image; /alive returns 200 once Rocket is up.
healthcheck:
  test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/alive"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 20s
restart: unless-stopped
networks: [zen-garden]
