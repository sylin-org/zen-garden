container_name: comfyui
image: yanwk/comfyui-boot:cu130-slim-v2
ports:
  default: [8188, 8188]
volumes:
  # Models — populate with checkpoints, LoRAs, VAE, ControlNet, etc.
  - comfyui-models:/root/ComfyUI/models
  - comfyui-hf-cache:/root/.cache/huggingface/hub
  # Custom nodes — persisted across container updates
  - comfyui-custom-nodes:/root/ComfyUI/custom_nodes
  - comfyui-pip-local:/root/.local
  # User data — input images, generated output, saved workflows
  - comfyui-input:/root/ComfyUI/input
  - comfyui-output:/root/ComfyUI/output
  - comfyui-user:/root/ComfyUI/user
  # Cache and config
  - comfyui-cache:/root/.cache
  - comfyui-config:/root/.config
  - comfyui-scripts:/root/user-scripts
environment:
  CLI_ARGS: "--enable-cors-header"
# GPU passthrough for NVIDIA stones
deploy:
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]
healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 120s
restart: unless-stopped
networks:
  - zen-garden
