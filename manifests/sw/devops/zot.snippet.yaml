container_name: zot
image: ghcr.io/project-zot/zot-linux-amd64:v2.1.1
ports:
  - [5050, 5000]
environment:
  ZOT_LOG_LEVEL: "info"
volumes:
  - zot-data:/var/lib/zot
healthcheck:
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/v2/"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s
restart: unless-stopped
networks:
  - zen-garden
