[workspace]
members = [
  # Old structure - will be removed in Phase 6
  # "src/linux/common",
  # "src/linux/moss",
  # "src/windows/garden-rake",
  "src/lantern",

  # New structure
  "src/common",
  "src/moss",
  "src/rake",
  "src/cricket",
  "src/firefly",
  "src/companion-sdk",
  "src/build-utils",
  "src/probe",
]
exclude = [
  # Orchestrators are standalone crates — not part of this workspace.
  # Each builds independently inside its own Docker image.
  "src/orchestrators/common",
  "src/orchestrators/ollama",
  "src/orchestrators/mongodb",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.92"
authors = ["Koan Framework"]

[workspace.dependencies]
# Core
anyhow = "1.0"
thiserror = "2"
chrono = "0.4"
uuid = { version = "1.6", features = ["v7"] }
rand = "0.9"
regex = "1.10"

# Async runtime — minimal features; each crate adds what it needs
tokio = { version = "1.35", features = ["sync", "time", "macros"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"

# HTTP
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Crypto / hashing
blake3 = "1.5"
base64 = "0.22"

# Networking
socket2 = "0.5"
if-addrs = "0.15"
mdns-sd = "0.17"

# System
sysinfo = "0.30"
walkdir = "2.4"
hostname = "0.4"
urlencoding = "2.1"
mime_guess = "2.0"
colored = "2.1"
url = "2.5"
rust-embed = "8"
open = "5.3"
tempfile = "3"

# Koi framework
koi-embedded = { path = "../koi/crates/koi-embedded" }
koi-certmesh = { path = "../koi/crates/koi-certmesh" }
koi-common = { path = "../koi/crates/koi-common" }
koi-crypto = { path = "../koi/crates/koi-crypto" }
koi-truststore = { path = "../koi/crates/koi-truststore" }

# ============================================================================
# Workspace-wide lint policy — enforces code-standards.md mechanically
# ============================================================================
[workspace.lints.clippy]
# Code standards §16: unsafe blocks must document invariants
# Set to "warn" for gradual adoption; promote to "deny" after full audit
undocumented_unsafe_blocks = "warn"
# Code standards §17: no .unwrap() on external data
# Set to "allow" at workspace level; enable per-crate as they're audited
unwrap_used = "allow"
# Incomplete work markers
todo = "allow"
unimplemented = "warn"
# Prefer native async fn over manual desugaring
manual_async_fn = "warn"
# Pin<Box<dyn Future>> is inherently verbose — allow until ARCH-0007 completes
type_complexity = "allow"

[workspace.lints.rust]
# Edition 2024 will enforce this; start warning now
unsafe_op_in_unsafe_fn = "warn"

# Dev profile: faster iteration
[profile.dev]
opt-level = 1              # Light optimization (faster than 0, still fast compile)
split-debuginfo = "packed" # Reduce linker work on incremental builds

# Optimize dependencies even in dev (they don't change often)
[profile.dev.package."*"]
opt-level = 2

# Optimize build scripts and proc-macros in dev (serde, clap derive run faster)
[profile.dev.build-override]
opt-level = 3

[profile.release]
strip = true      # Remove symbols for smaller binaries
lto = true        # Link-time optimization (full - slowest, smallest)
codegen-units = 1 # Better optimization (slower compile, smaller binary)

# Fast release profile for development iteration
# Usage: cargo build --profile fast-release
# Trade-off: ~5-10% larger binaries, ~1-3% slower runtime, ~40% faster compile
[profile.fast-release]
inherits = "release"
lto = "thin"      # Thin LTO: 80% of full LTO benefit, much faster compile
codegen-units = 4 # Parallel codegen: 4x faster than codegen-units=1
strip = true      # Still strip symbols
