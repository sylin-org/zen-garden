[package]
name = "garden-companion-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "SDK for building Zen Garden companions"

[lib]
name = "garden_companion_sdk"
path = "src/lib.rs"

[dependencies]
garden-common = { path = "../common" }

# Core
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# HTTP server
axum.workspace = true

# HTTP client (for SSE)
reqwest = { workspace = true, features = ["stream"] }
futures-util = "0.3"

# CLI
clap = { workspace = true, features = ["derive", "env"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Event envelope (COMPANION-0002 — Book I of COMPANION-0001)
uuid = { workspace = true, features = ["v7"] }
chrono = { workspace = true, features = ["serde"] }

# Transport trait shutdown signalling (COMPANION-0004 — Book III of COMPANION-0001)
tokio-util = "0.7"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true
# HTTP client for integration tests (COMPANION-0010 Book IX)
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
