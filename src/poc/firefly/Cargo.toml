[package]
name = "garden-firefly"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Visual status indicator companion for Zen Garden (Waveshare RP2040-Matrix)"

[lints]
workspace = true

[[bin]]
name = "garden-firefly"
path = "src/main.rs"

[dependencies]
garden-common = { path = "../common" }
garden-companion-sdk = { path = "../companion-sdk" }
garden-companion-usb = { path = "../companion-usb" }

# Core
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing.workspace = true
tracing-subscriber.workspace = true

# Config & CLI
clap = { workspace = true, features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true

thiserror = "2"

# Random for firefly animation
rand = "0.9"

# serialport pulls libudev on Linux (used by the `ports` diagnostic). musl (Android/arm64 Stone) has
# no libudev, so drop it there — available_ports() falls back to /sys and open() is unaffected.
[target.'cfg(not(target_env = "musl"))'.dependencies]
serialport = "4.3"

[target.'cfg(target_env = "musl")'.dependencies]
serialport = { version = "4.3", default-features = false }
