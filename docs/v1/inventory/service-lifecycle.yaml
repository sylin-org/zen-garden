- id: gateway-registry-leases
  name: Tool/gateway registry + orchestrator leases (TOOLS-0003/ORCH-0004)
  maturity: live-proven
  verdict: keep
  what: Write-through GardenRegistry (Local|Gateway|Announced origins); orchestrators dual-register (koi mDNS + moss gateway PUT, 30s heartbeat / 60s TTL); ollama adds adaptive VRAM model leases (15s x1.25 cap 300s).
  naming_hazard: THREE unrelated "lease" concepts share vocabulary (mDNS lease, gateway TTL, VRAM lease).

## Surprises (consolidated)
1. Remove-volumes contradiction (destructive-path doc-vs-code). 2. Vacate/Replant type-fiction. 3. Every managed container silently gets RW mount of shared topology dir (docker/lifecycle.rs:456-461). 4. Fallback renames instances ::legacy. 5. Log-regex image fallbacks. 6. Port remaps silently abandoned on mismatch. 7. Static IP refcounting. 8. Capacity fails open. 9. Jobs non-persistent despite long installs. 10. Self-heal race returns "try again shortly" not queue. 11. await_container_removed polls inspect-404 (Docker remove returns before cleanup). 12. fwupd Windows-empty. 13. Compose-on-start cycles containers on daemon restart. 14. Three lease vocabularies. 15. hw manifests embedded. 16. Ceremony journal writers without recovery consumer. 17. Greenhouse generate-from-container unadvertised.
