[package]
name = "garden-moss"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "garden-moss"
path = "src/main.rs"

[dependencies]
garden-common = { path = "../common" }
koi-embedded = { workspace = true }
koi-common = { workspace = true }
koi-certmesh = { workspace = true }
koi-crypto = { workspace = true }
# Reduced from "full" - server needs: multi-thread runtime, networking, signals, process spawning
tokio = { version = "1.35", features = ["rt-multi-thread", "io-util", "net", "signal", "process", "fs", "sync", "time", "macros"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bollard = "0.16"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
base64 = "0.21"
chrono = "0.4"
clap = { version = "4.4", features = ["derive", "env"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.10"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
sysinfo = "0.30"
local-ip-address = "0.6"
uuid = { version = "1.6", features = ["v5", "v7"] }
hostname = "0.4"
rand = "0.8"
async-stream = "0.3"
blake3 = "1.5"
sha2 = "0.10"
socket2 = "0.5"
async-trait = "0.1"
dashmap = "5.5"
chacha20poly1305 = "0.10"
argon2 = "0.5"
walkdir = "2.4"
url = "2.5"
urlencoding = "2.1"
cron = "0.12"

# WebDAV server (STORAGE-0009 Phase 3)
dav-server = "0.11"

# Filesystem watcher — detect external writes for replication (STORAGE-0009 Phase 5)
notify = "7"

# S3 gateway
md5 = "0.7"
hex = "0.4"
mime_guess = "2.0"

# Embedded assets (manifests + default Companions)
rust-embed = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging"
] }
windows = { version = "0.52", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common"
] }
winreg = "0.52"

# Cloud Filter — native Windows Explorer sync (STORAGE-0009 Phase 4)
cloud-filter = "0.0.6"
nt-time = "0.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["process", "signal"] }
udev = "0.9"
libc = "0.2"
sd-notify = "0.4"

[dev-dependencies]
tempfile = "3.10"

[build-dependencies]
garden-build-utils = { path = "../build-utils" }
embed-resource = "3"
